<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>闽菜食材菜谱库</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        minred: '#c8161d',
        'minred-dark': '#a01217',
        'minred-light': '#fde8e9',
        'minred-50': '#fef2f2',
        'minred-100': '#fde8e9',
        'minred-600': '#c8161d',
        'minred-700': '#a01217',
      }
    }
  }
}
</script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap');
  * { font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif; }
  body { background: #fafaf9; }
  .card-hover { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
  .card-hover:hover { transform: translateY(-4px); box-shadow: 0 20px 40px -12px rgba(200, 22, 29, 0.15), 0 4px 12px rgba(0,0,0,0.08); }
  .tag-active { background: #c8161d; color: white; border-color: #c8161d; }
  .tag-inactive { background: white; color: #57534e; border-color: #d6d3d1; }
  .tag-inactive:hover { border-color: #c8161d; color: #c8161d; background: #fef2f2; }
  .modal-overlay { background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); }
  .fade-in { animation: fadeIn 0.25s ease-out; }
  .slide-up { animation: slideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1); }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { opacity: 0; transform: translateY(40px) scale(0.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
  .ingredient-tag-remove { transition: all 0.15s; }
  .ingredient-tag-remove:hover { background: #c8161d; color: white; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #d6d3d1; border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #a8a29e; }
  .difficulty-badge.easy { background: #dcfce7; color: #166534; }
  .difficulty-badge.medium { background: #fef3c7; color: #92400e; }
  .difficulty-badge.hard { background: #fde8e9; color: #991b1b; }
</style>
</head>
<body class="min-h-screen">

<header class="bg-white border-b border-stone-200 sticky top-0 z-30 shadow-sm">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-minred flex items-center justify-center text-white font-bold text-lg shadow-md shadow-minred/25">闽</div>
        <div>
          <h1 class="text-xl sm:text-2xl font-bold text-stone-900 tracking-tight">闽菜食材菜谱库</h1>
          <p class="text-xs sm:text-sm text-stone-500">输入 / 选择食材，找出能做的菜</p>
        </div>
      </div>
      <div class="hidden sm:flex items-center gap-2 text-sm text-stone-400">
        <span class="px-3 py-1 rounded-full bg-minred-50 text-minred font-medium" id="recipeCount">50 道菜谱</span>
      </div>
    </div>
  </div>
</header>

<main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">

  <section class="mb-8">
    <div class="bg-white rounded-2xl p-5 sm:p-6 shadow-sm border border-stone-200">
      <div class="relative mb-4">
        <div class="flex gap-3">
          <div class="relative flex-1">
            <svg class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-stone-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
            <input type="text" id="ingredientInput" placeholder="输入食材名称，如：五花肉、海蛎、虾仁..." class="w-full pl-12 pr-4 py-3.5 rounded-xl border-2 border-stone-200 focus:border-minred focus:ring-4 focus:ring-minred/10 outline-none text-stone-800 placeholder:text-stone-400 transition-all text-base" autocomplete="off"/>
            <div id="suggestions" class="absolute top-full left-0 right-0 mt-2 bg-white rounded-xl border border-stone-200 shadow-xl z-20 hidden overflow-hidden"></div>
          </div>
          <button id="addIngredientBtn" class="px-6 py-3.5 bg-minred hover:bg-minred-dark text-white font-medium rounded-xl transition-all shadow-md shadow-minred/20 hover:shadow-lg hover:shadow-minred/30 active:scale-95 whitespace-nowrap">添加食材</button>
        </div>
      </div>
      <div id="selectedTags" class="flex flex-wrap gap-2 mb-4 min-h-[28px]"></div>
      <div>
        <p class="text-xs text-stone-400 mb-2.5 font-medium">常用食材 · 点击多选</p>
        <div id="presetTags" class="flex flex-wrap gap-2"></div>
      </div>
    </div>
  </section>

  <section class="mb-4">
    <div class="bg-white rounded-2xl p-4 sm:p-5 shadow-sm border border-stone-200 space-y-3">
      <div class="flex items-center gap-2 flex-wrap">
        <span class="text-xs font-semibold text-stone-500 w-10 shrink-0">流派</span>
        <div id="styleFilters" class="flex gap-1.5 flex-wrap"></div>
      </div>
      <div class="flex items-center gap-2 flex-wrap">
        <span class="text-xs font-semibold text-stone-500 w-10 shrink-0">难度</span>
        <div id="difficultyFilters" class="flex gap-1.5 flex-wrap"></div>
      </div>
      <div class="flex items-center gap-2 flex-wrap">
        <span class="text-xs font-semibold text-stone-500 w-10 shrink-0">耗时</span>
        <div id="timeFilters" class="flex gap-1.5 flex-wrap"></div>
      </div>
    </div>
  </section>

  <div class="flex items-center justify-between mb-4">
    <p class="text-sm text-stone-500">共 <span id="resultCount" class="font-bold text-minred text-lg">50</span> 道菜谱<span id="filterHint" class="hidden text-stone-400 ml-1">（已筛选）</span></p>
    <button id="clearFilterBtn" class="hidden text-sm text-minred hover:text-minred-dark font-medium transition-colors flex items-center gap-1">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      清除筛选
    </button>
  </div>

  <section id="recipeGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-5 mb-12"></section>

  <div id="emptyState" class="hidden text-center py-20">
    <div class="text-6xl mb-4">🍳</div>
    <h3 class="text-xl font-bold text-stone-700 mb-2">没有找到匹配的菜谱</h3>
    <p class="text-stone-400 mb-4">试试调整或减少筛选食材</p>
    <button onclick="clearAllFilters()" class="px-6 py-2.5 bg-minred text-white rounded-xl hover:bg-minred-dark transition-all font-medium">清除所有筛选</button>
  </div>
</main>

<div id="detailModal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 modal-overlay fade-in" onclick="closeModalOutside(event)">
  <div class="bg-white rounded-2xl max-w-2xl w-full max-h-[85vh] overflow-y-auto shadow-2xl slide-up" id="modalContent"></div>
</div>

<footer class="border-t border-stone-200 bg-white mt-auto">
  <div class="max-w-7xl mx-auto px-4 py-6 text-center text-sm text-stone-400">
    闽菜食材菜谱库 · 收录 50 道经典闽菜 · 福州菜 · 闽南菜 · 闽西菜 · 莆仙菜
  </div>
</footer>

<script>
const recipes = [
{"name":"佛跳墙","style":"福州菜","taste":"清鲜醇厚、浓郁荤香","mainIngredients":"鲍鱼 6只, 海参 4条, 鱼肚 100g, 鱼翅 50g, 干贝 50g, 花菇 8朵, 猪蹄筋 200g, 鸡腿 2只, 鸭掌 4只, 排骨 300g","seasoning":"绍兴酒 100ml, 生姜 30g, 葱白 3根, 冰糖 20g, 生抽 30ml, 高汤 1.5L","difficulty":"困难","time":"3小时","servings":"6-8人份","tips":"干货至少提前12小时分开泡发，中途换水2-3次；坛底垫竹篦防粘锅；全程保持微沸不翻滚，汤色才会清澈金黄","story":"佛跳墙创于清光绪年间，由福州聚春园名厨郑春发创制。相传一秀才闻香赋诗「坛启荤香飘四邻，佛闻弃禅跳墙来」而得名。是闽菜首席名菜、国宴常客，被誉为「闽菜之王」，多次出现在中国国宴和外事招待中。","link":"https://baike.baidu.com/item/佛跳墙","steps":"1.鲍鱼、海参、鱼肚、鱼翅、干贝、花菇分别提前12小时用冷水泡发，中途换水2-3次，泡发后将海参去内脏洗净、鱼翅去骨、花菇去蒂；2.猪蹄筋用温水浸泡4小时至回软，刮去表面油脂；3.鸡腿、鸭掌、排骨分别冷水下锅，加入料酒15ml焯水5分钟，撇去浮沫捞出沥干；4.取大号炖坛，底部垫竹篦，先铺葱白段和姜片，再按照质地从下到上依次码放：排骨、猪蹄筋、鸡腿、鸭掌、花菇、干贝、鱼肚、海参、鱼翅、鲍鱼；5.沿坛壁缓缓倒入高汤和绍兴酒，加入生抽和冰糖，液面以刚好没过顶层食材为准；6.取干荷叶一张洗净盖在坛口，再盖上坛盖，置于炉上用大火烧开后立即转为文火（保持坛内汤汁微微冒泡即可），慢煨2.5小时；7.关火后静置10分钟再开盖，撇去表面浮油，尝味补盐即可上桌"},
{"name":"荔枝肉","style":"福州菜","taste":"酸甜酥脆、鲜嫩多汁","mainIngredients":"猪里脊肉 300g, 马蹄 100g, 胡萝卜 50g, 青椒 1个","seasoning":"番茄酱 30g, 白糖 25g, 白醋 15ml, 盐 3g, 淀粉 30g, 蒜末 15g","difficulty":"中等","time":"30分钟","servings":"3-4人份","tips":"里脊肉剞花刀深度约为肉厚的2/3，太浅不卷、太深易断；油温控制在170℃左右（放入筷子冒密集小泡即可）；炸至肉块自然卷曲形似荔枝立即捞出","story":"福州传统名菜，已有二百余年历史。因肉块剞十字花刀炸后自然卷曲、形似荔枝外壳而得名。是福州人宴席和家常餐桌必备的经典酸甜菜肴，与醉排骨并称福州双绝。","link":"https://baike.baidu.com/item/荔枝肉","steps":"1.猪里脊肉切成2cm见方的小块，在每块表面剞十字花刀（深度约2/3），加盐1g、料酒少许、水淀粉10g抓匀腌制15分钟；2.马蹄去皮切块，胡萝卜切菱形片，青椒去籽切块备用；3.将腌好的肉块均匀裹上干淀粉，确保每一条花刀缝隙都沾到粉，抖去多余粉；4.锅中倒入足量油烧至170℃，逐块下肉炸约2-3分钟至表面金黄、肉块卷曲形似荔枝，捞出控油，再大火复炸30秒使外壳更酥脆；5.另取一碗调糖醋汁：番茄酱30g+白糖25g+白醋15ml+清水30ml+水淀粉10g搅匀；6.锅中留底油15ml，小火爆香蒜末至微微金黄，倒入糖醋汁中火熬至冒大泡、汤汁浓稠；7.倒入炸好的肉块和马蹄、胡萝卜、青椒，大火快速翻拌15秒使每块均匀裹上酱汁，立即出锅装盘"},
{"name":"鸡汤汆海蚌","style":"福州菜","taste":"鲜甜脆嫩、原汁原味","mainIngredients":"鲜活海蚌 6只, 老母鸡 半只(约750g)","seasoning":"生姜 20g, 葱白 2根, 盐 5g, 料酒 15ml","difficulty":"简单","time":"40分钟","servings":"2-3人份","tips":"鸡汤必须撇净浮油，否则冲入蚌肉时油会裹住蚌肉影响口感；海蚌汆烫时间不超过30秒，以刚变白为最佳","story":"福州高档宴席名菜，以长乐漳港海蚌与老母鸡汤搭配。漳港海蚌是福州长乐特产，肉质脆嫩鲜甜。讲究「汆」字——滚汤冲入蚌肉瞬间烫熟，以秒计的火候是这道菜的精髓，展现了闽菜对鲜味的极致追求。","link":"https://baike.baidu.com/item/鸡汤汆海蚌","steps":"1.老母鸡洗净斩大块，冷水下锅加姜片10g、料酒10ml焯水3分钟，捞出用温水冲洗干净；2.将鸡块放入汤锅，加入2L清水、姜片10g、葱白段，大火烧开转小火慢炖40分钟，期间用汤勺撇去表面浮油至汤面清澈见底，加盐5g调味后过滤备用；3.鲜活海蚌用刷子清洗外壳，用小刀沿壳缝插入撬开，完整取出蚌肉，去除内脏和裙边黑膜，清水冲洗干净后片成2mm厚的薄片；4.将蚌肉片均匀铺在汤碗底部，撒少许盐和料酒；5.将滚烫的清鸡汤（约95℃）从碗边缓缓冲入，使蚌肉被热汤汆烫30秒至刚变白即可，切勿搅拌，让蚌肉自然浸熟保持脆嫩口感"},
{"name":"红糟肉","style":"福州菜","taste":"糟香浓郁、咸甜适口","mainIngredients":"五花肉 500g","seasoning":"红糟 50g, 冰糖 20g, 生抽 25ml, 料酒 20ml, 生姜 15g, 葱白 2根","difficulty":"简单","time":"60分钟","servings":"3-4人份","tips":"五花肉选三层肥瘦相间的为佳；红糟需先炒香才能激发出浓郁糟香；加水必须用开水，冷水会使肉质紧缩变硬","story":"福州特色家常菜，以红糟为核心调味。红糟是福州特有的调味品——以红曲米酿制青红酒后剩余的糟粕，富含氨基酸和天然红色素。闽菜「糟香」风味系列的代表作之一，也是福州人餐桌上的下饭神器。","link":"https://baike.baidu.com/item/红糟肉","steps":"1.五花肉洗净切成3cm见方的块，冷水下锅加姜片少许焯水5分钟，煮出血沫后捞出温水洗净沥干；2.炒锅不放油，中小火下冰糖慢慢炒化，不断搅拌至冰糖融化成琥珀色糖浆；3.下五花肉块快速翻炒，使每块肉均匀裹上糖色，继续煸炒约3分钟至肥肉部分微微出油、表面微黄；4.将肉块拨到锅边，用锅中余油爆香红糟、姜片、葱白段，红糟翻炒约1分钟至飘出浓郁糟香；5.将肉块与红糟翻拌均匀，沿锅边淋入料酒和生抽，翻炒至肉块均匀上色；6.加入刚烧开的开水，水量刚好没过肉块即可，大火烧开后转入砂锅或加盖留小火焖煮40分钟；7.开盖转大火收汁，用锅铲不停翻动防止粘锅，收至汤汁浓稠挂在肉块表面即可出锅"},
{"name":"醉排骨","style":"福州菜","taste":"酸甜微香、外酥里嫩","mainIngredients":"猪小排 500g","seasoning":"蒜末 20g, 白糖 30g, 白醋 25ml, 生抽 15ml, 椒盐 3g, 淀粉 40g","difficulty":"中等","time":"40分钟","servings":"3-4人份","tips":"排骨选小排（肋排）口感最佳；炸好的排骨要趁滚热倒入醉汁，冷热交替让排骨瞬间吸收味道","story":"福州经典冷热双吃名菜。排骨炸至酥脆后趁热浇入酸甜醉汁，冷热交替间瞬间入味，酸甜咸香层次分明。是福州家庭年夜饭和宴席上的常备菜肴，福州「酸甜双绝」之一。","link":"https://baike.baidu.com/item/醉排骨","steps":"1.猪小排斩成3cm长的小段，冷水浸泡20分钟泡出血水，捞出沥干水分；2.排骨加生抽5ml、料酒10ml、姜片5g抓匀腌制15分钟入味；3.腌好的排骨均匀裹上一层干淀粉，轻轻拍去多余粉末；4.锅中倒油烧至170℃，下排骨中火炸约5-6分钟至表面金黄酥脆，捞出沥油，再大火复炸1分钟增加酥脆度；5.趁炸排骨的时间调醉汁：碗中放入蒜末20g、白糖30g、白醋25ml、生抽10ml、椒盐3g，加少许温水搅拌使糖融化；6.炸好的排骨沥干油立即趁热倒入醉汁中，快速翻拌使每块排骨均匀裹上汁液，静置2-3分钟让排骨充分吸收酸甜醉汁后装盘"},
{"name":"太极芋泥","style":"福州菜","taste":"香甜绵密、入口即化","mainIngredients":"槟榔芋头 600g","seasoning":"白糖 80g, 猪油 40g, 牛奶 60ml, 红豆沙 100g","difficulty":"简单","time":"50分钟","servings":"4-6人份","tips":"芋头必须趁热捣泥，冷却后会变硬难捣；加猪油是芋泥细腻顺滑的关键，不可用植物油替代；太极造型可用勺子背蘸水抹出光滑表面","story":"福州传统甜点名品，以福鼎槟榔芋为主料，猪油和白糖捣成绵密芋泥。太极造型寓意阴阳调和，是福州宴席中最后一道压轴甜品，口感香甜绵密入口即化，常令食客惊艳。","link":"https://baike.baidu.com/item/太极芋泥","steps":"1.槟榔芋头去皮切成2cm厚片（去皮时戴手套防芋头黏液引起皮肤痒），清水冲洗后放入蒸锅；2.水开后大火蒸25-30分钟，用筷子能轻松戳透芋头即可出锅；3.趁热将芋头放入大碗中，用勺子背或捣泥器用力压成细腻的芋泥，不能有颗粒；4.趁芋泥滚烫时加入白糖80g、猪油40g（提前融化）、牛奶60ml，用力搅拌至白糖完全融化、芋泥呈顺滑奶油状；5.取一半芋泥与红豆沙100g混合拌匀调成深棕色（可用少许食用红色素调色）；6.取太极模具或直接在圆盘中，将浅色芋泥和深色芋泥分别装入裱花袋，按照太极图案挤出S形分隔线，两边各点一小圆点，用勺子背蘸温水抹平表面；7.放入冰箱冷藏30分钟定型后即可食用，也可趁热直接吃"},
{"name":"南煎肝","style":"福州菜","taste":"滑嫩咸鲜、酱香浓郁","mainIngredients":"猪肝 300g, 胡萝卜 60g, 蒜苗 2根","seasoning":"生抽 20ml, 料酒 15ml, 淀粉 15g, 白糖 8g, 盐 3g, 蒜末 15g","difficulty":"简单","time":"15分钟","servings":"3-4人份","tips":"猪肝切得越薄越好（约2-3mm）；滑炒时间不超过30秒，变色即捞出，余温会继续熟化；泡水去血水是去腥关键","story":"福州家常名菜，「南煎」是福州方言中一种独特的烹饪技法——先滑炒后烹汁，讲究火候精准。猪肝在锅中停留不过数十秒，以保持极致的嫩滑口感，是检验福州厨师火功的试金石。","link":"https://baike.baidu.com/item/南煎肝","steps":"1.猪肝切成2-3mm厚的薄片，放入大碗中加冷水浸泡10分钟，换水2次至水不再变红，捞出挤干水分；2.猪肝片加料酒10ml、淀粉10g、少许盐抓匀腌制5分钟上浆；3.胡萝卜切菱形薄片，蒜苗斜刀切段；4.锅烧至冒烟后倒入油30ml，大火烧至七成热，下猪肝片快速滑炒15-20秒至变色（表面刚转灰白色），立即盛出；5.锅中留底油，下蒜末爆香，加入胡萝卜片翻炒1分钟至断生，加蒜苗段翻炒几下；6.将生抽20ml、白糖8g、水30ml、淀粉5g调成碗汁倒入锅中，中火搅至汤汁变透亮浓稠；7.倒入滑好的猪肝，大火快速翻拌10秒使每片猪肝裹满酱汁即出锅，不宜久炒"},
{"name":"淡糟香螺片","style":"福州菜","taste":"糟香鲜甜、脆嫩爽口","mainIngredients":"香螺 400g, 冬笋 100g, 香菇 6朵","seasoning":"红糟 30g, 料酒 15ml, 白糖 8g, 盐 4g, 淀粉 10g, 姜葱 各15g","difficulty":"中等","time":"30分钟","servings":"3-4人份","tips":"香螺肉焯水时间不超过10秒，否则会变老变硬；红糟先加少许料酒调稀再下锅不会结块；全程大火快炒","story":"福州糟香菜系的经典代表，以鲜活香螺搭配福州红糟急火快炒。「淡糟」即红糟用量适中不抢螺肉本身的鲜甜。螺片脆嫩、糟香淡雅，是福州高档宴席中一道精致的炒菜。","link":"https://baike.baidu.com/item/淡糟香螺片","steps":"1.香螺用刷子刷净外壳，锅中水烧开后放入香螺煮30秒捞出，用牙签挑出螺肉，去除内脏和硬质部分，将螺肉切成2mm薄片；2.冬笋去皮后切薄片焯水2分钟去涩味，香菇泡发后斜刀切片；3.红糟加料酒10ml搅匀调稀备用；4.锅中水烧开，下螺片快速焯10秒立即捞出过冷水，沥干；5.炒锅大火烧热下油30ml，爆香姜片和葱白段至微黄，下冬笋片和香菇片中火翻炒2分钟出香；6.转大火倒入红糟炒30秒至糟香四溢，加入白糖、盐和少许水搅匀；7.下螺片大火猛炒15秒，淋入水淀粉勾薄芡，翻匀立即出锅，螺片在锅中总时间不超过30秒"},
{"name":"红糟鸡","style":"福州菜","taste":"糟香浓郁、鸡肉鲜嫩","mainIngredients":"三黄鸡 1只(约1kg), 红糟 60g","seasoning":"料酒 30ml, 生姜 25g, 葱白 3根, 白糖 15g, 盐 5g, 生抽 20ml","difficulty":"中等","time":"70分钟","servings":"4-5人份","tips":"三黄鸡选1kg左右的为佳，太大肉质偏老；红糟必须炒透才能去除生糟味、激发香气；焖煮时火候要小，保持汤面微微冒泡即可","story":"福州传统糟香菜之一，三黄鸡与红糟同焖，糟香深入骨髓。红糟的天然红色赋予鸡肉诱人的色泽，是福州人过年过节餐桌上的常见硬菜，冷食热食皆宜。","link":"https://baike.baidu.com/item/红糟鸡","steps":"1.三黄鸡处理干净，斩去鸡屁股和爪尖，整鸡冷水下锅加姜片10g、料酒15ml焯水5分钟，捞出用温水冲洗干净沥干；2.炒锅下油30ml烧热，下姜片15g和葱白段以小火炸至微金黄出香；3.转中火下红糟60g，用铲子不断推炒约2分钟，至红糟颜色变深、香气四溢；4.加入白糖15g炒化，放入整鸡来回翻面，使鸡身均匀裹上红糟上色；5.沿锅边淋入料酒15ml和生抽20ml，加入开水至没过鸡身2/3处（约500ml）；6.大火烧开后加盖转小火，保持汤汁微微冒泡，焖煮50分钟，中间翻面一次确保入味均匀；7.开盖用筷子戳鸡腿最厚处，无血水流出即熟，大火收汁3-5分钟至汤汁挂在鸡身上，取出斩件装盘淋上原汁"},
{"name":"醉虾","style":"福州菜","taste":"鲜爽微醉、Q弹入味","mainIngredients":"鲜活基围虾 500g","seasoning":"绍兴酒 150ml, 生抽 30ml, 白醋 10ml, 白糖 15g, 蒜末 20g, 小米辣 3个","difficulty":"简单","time":"60分钟","servings":"3-4人份","tips":"虾一定要选鲜活的，死虾口感差且有腥味；浸泡时间至少1小时才能入味，但不宜超4小时否则虾肉会变粉；冷藏后口感更Q弹","story":"福州夏令佐酒名菜，鲜活虾以绍兴酒为主的调味汁浸泡入味，虾肉在酒的作用下变得Q弹紧实，带微醺酒香。源于福建沿海地区对海鲜本味的崇尚，是福州人夏日餐桌上的开胃菜。","link":"https://baike.baidu.com/item/醉虾","steps":"1.鲜活基围虾用剪刀剪去虾须和虾枪，用牙签从虾背第二关节处挑出虾线，清水冲洗干净沥干；2.小米辣切圈，蒜头剁成蒜末备用；3.调醉汁：取大碗放入绍兴酒150ml、生抽30ml、白醋10ml、白糖15g、蒜末20g、小米辣圈，加凉白开50ml搅匀使白糖融化，静置5分钟让蒜和辣椒的辛香味释放到汁中；4.将处理好的虾放入深碗中，浇入调好的醉汁，确保汁液没过所有虾（如果不够可补充绍兴酒）；5.盖上保鲜膜，放入冰箱冷藏室腌制1小时，中间翻动一次确保上下入味均匀；6.取出后将虾装盘，淋上适量醉汁，虾身呈半透明的浅粉色、Q弹爽口即可食用"},
{"name":"福州鱼丸汤","style":"福州菜","taste":"鲜香Q弹、汤清味醇","mainIngredients":"福州鱼丸 12颗, 青菜 150g, 虾皮 10g","seasoning":"盐 5g, 白胡椒粉 2g, 香油 5ml, 葱花 适量","difficulty":"简单","time":"15分钟","servings":"2-3人份","tips":"福州鱼丸以鳗鱼肉或鲨鱼肉打制的为佳，煮至全部浮起再煮1分钟即可；汤中加少许虾皮可提鲜","story":"福州最具代表性的小吃之一，鱼丸以鳗鱼或鲨鱼肉手工打制，外皮Q弹、内馅含猪肉。福州有「无鱼丸不成席」之说，是福州人从小吃到大的家乡味道，也是海外福州侨胞最思念的乡愁食物。","link":"https://baike.baidu.com/item/福州鱼丸","steps":"1.青菜摘洗干净，切成5cm长的段备用；2.锅中加入1L清水大火烧开，下入冷冻或冷藏的福州鱼丸（无需解冻）；3.保持中大火煮约5-6分钟，待鱼丸全部浮起后继续煮1分钟，让内馅充分熟透；4.加入青菜段和虾皮10g，煮约1分钟至青菜断生但保持翠绿；5.加盐5g、白胡椒粉2g调味，滴入香油5ml增香，关火撒上葱花即可盛碗"},
{"name":"肉燕汤","style":"福州菜","taste":"皮薄馅嫩、鲜香可口","mainIngredients":"肉燕皮 200g, 猪肉馅 250g, 葱花 适量","seasoning":"盐 6g, 生抽 15ml, 香油 5ml, 白胡椒粉 3g","difficulty":"中等","time":"20分钟","servings":"3-4人份","tips":"肉燕皮是福州特色，以猪肉捶打制成；包肉燕时收口要捏紧否则煮时会散开；浮起后再煮1分钟确保肉馅熟透","story":"福州独有的传统小吃，肉燕皮以猪后腿肉经千锤百打制成，薄如纸、白如玉。与普通馄饨皮的根本区别在于——肉燕皮本身就是肉，而非面粉。是福州「太平燕」的基础食材，也是福州饮食智慧的结晶。","link":"https://baike.baidu.com/item/肉燕","steps":"1.猪肉馅（七分瘦三分肥）放入碗中，加生抽10ml、盐2g、白胡椒粉1g、葱花少许、淀粉5g朝一个方向用力搅打3分钟至上劲起胶；2.取肉燕皮一张铺在掌心，放入约10g肉馅，将四角捏拢收口，轻轻压实形成石榴状，依次包完所有肉燕；3.锅中加清水1.5L大火烧开，将包好的肉燕沿锅边滑入，用勺背轻轻推动防止粘底；4.保持中火煮约5-6分钟至肉燕全部浮起，再煮1分钟确保内馅完全熟透；5.碗中加盐4g、生抽5ml、白胡椒粉2g、香油5ml，连汤带肉燕盛入碗中，撒上葱花即可"},
{"name":"葱烧海鲈鱼","style":"福州菜","taste":"鲜香浓郁、鱼肉细嫩","mainIngredients":"海鲈鱼 1条(约600g), 大葱 3根","seasoning":"生抽 30ml, 老抽 8ml, 料酒 20ml, 白糖 10g, 生姜 20g, 蒜末 15g","difficulty":"中等","time":"35分钟","servings":"3-4人份","tips":"鲈鱼选新鲜海鲈鱼眼睛明亮、鱼鳃鲜红的；蒸鱼时间按每500g蒸8分钟计算；最后淋热油激香是提升风味的关键一步","story":"福州沿海地区经典鱼类菜肴，以新鲜海鲈鱼搭配大量葱段蒸制。葱香与鱼鲜相互渗透，最后热油浇淋激发葱香，是福州人「无鱼不成席」饮食文化的代表菜式。","link":"https://baike.baidu.com/item/葱烧海鲈鱼","steps":"1.海鲈鱼刮鳞去鳃去内脏，在鱼身两侧各划三刀（深度至骨），用料酒10ml、盐2g抹匀鱼身腌制10分钟去腥；2.大葱取2根切成6cm长段铺在蒸盘底部（使鱼架空方便蒸汽流通），剩余1根切成细丝泡冷水备用；3.生姜15g切片铺在葱段上，放上腌好的鲈鱼，鱼身上再放几片姜；4.蒸锅水烧开后放入鱼盘，大火蒸12分钟（600g的鱼），关火后虚蒸2分钟再揭盖；5.取出鱼盘倒掉蒸出的腥汁，拣去葱姜，在鱼身撒上泡好的葱丝；6.小碗中调汁：生抽30ml、老抽8ml、白糖10g、料酒10ml、清水30ml搅匀加热至微沸；7.将热酱汁沿鱼盘边淋入（不要直接浇在鱼身上），另起锅烧热油20ml至微微冒烟，浇在葱丝上激出香味即可"},
{"name":"糟菜炒粉干","style":"福州菜","taste":"糟香干爽、咸淡适中","mainIngredients":"粉干 300g, 糟菜 50g, 瘦肉丝 100g, 豆芽 120g","seasoning":"生抽 15ml, 盐 3g, 葱花 适量, 蒜末 15g","difficulty":"简单","time":"20分钟","servings":"2-3人份","tips":"粉干泡软即可不宜久泡否则炒时会断；糟菜本身有咸味，加盐要适量；全程大火快炒粉干才不粘锅","story":"福州街头巷尾最常见的家常主食。糟菜是福州特产腌菜，以芥菜经红糟腌制发酵而成，酸中带糟香。与粉干同炒，干香爽口，是福州人从小吃到大的「妈妈味道」。","link":"https://baike.baidu.com/item/糟菜炒粉干","steps":"1.粉干放入温水中浸泡8-10分钟至回软但有弹性，捞出沥干水分（不要太软）；2.瘦肉切细丝加少许生抽、淀粉抓匀腌5分钟，糟菜切细丝，豆芽摘去根部洗净沥干；3.炒锅烧热下油25ml，小火爆香蒜末至微黄，下瘦肉丝滑炒至变色盛出；4.锅中再加少许油，下糟菜丝中火煸炒1分钟至糟香飘出；5.转大火下入豆芽快速翻炒30秒，倒入粉干用筷子与锅铲配合不断翻炒，防止粘锅；6.下回锅的瘦肉丝，淋入生抽15ml和盐3g，大火继续炒2分钟至粉干热透、水分收干；7.关火撒葱花翻拌均匀即可出锅"},
{"name":"水晶包","style":"福州菜","taste":"皮薄晶莹、馅鲜多汁","mainIngredients":"澄粉 150g, 玉米淀粉 50g, 猪肉馅 200g, 香菇 5朵, 笋丁 80g","seasoning":"盐 5g, 生抽 15ml, 蚝油 10ml, 生姜 10g, 葱花 适量","difficulty":"中等","time":"40分钟","servings":"3-4人份(约15个)","tips":"澄粉必须用刚烧开的沸水烫面才能形成透明皮；面团趁热揉制否则会开裂；蒸的时间不宜超过10分钟否则皮会塌","story":"福州精致的蒸点，以澄粉烫面制成半透明外皮，透过皮能隐约看到内馅，故称「水晶」。源于广式虾饺的澄面工艺在福州的本地化演变，是福州早茶和宴席点心中的颜值担当。","link":"https://baike.baidu.com/item/水晶包","steps":"1.盆中混合澄粉150g和玉米淀粉50g，将刚烧开的沸水180ml一次性冲入，用筷子快速搅拌成雪花状；2.稍凉到手能承受时趁热揉成光滑面团，盖上湿布醒面10分钟；3.猪肉馅加香菇丁（干香菇提前泡发切丁）、笋丁、姜末、生抽、蚝油、盐、葱花朝一个方向搅打至起胶，冷藏20分钟使馅料紧实；4.醒好的面团搓成长条，切成约15g一个的小剂子，用刀面蘸油压成薄圆形皮（或用擀面杖擀薄，越薄越透）；5.取一张皮放入约15g馅料，用包包子的手法收口捏紧，收口朝下放在铺了油纸的蒸笼里；6.蒸锅水烧开后放上蒸笼，大火蒸8-10分钟，透过皮看到馅料颜色即为熟透，关火立即出锅（不宜久蒸）"},
{"name":"姜母鸭","style":"闽南菜","taste":"酱香浓郁、姜香去腥","mainIngredients":"番鸭 半只(约1kg), 老姜 200g","seasoning":"米酒 100ml, 生抽 30ml, 老抽 15ml, 冰糖 25g, 桂皮 1小块, 八角 2个","difficulty":"中等","time":"90分钟","servings":"4-5人份","tips":"老姜要选纤维粗、辣味足的，切厚片干煸出香是姜母鸭的灵魂；番鸭比普通鸭肉更紧实鲜美；砂锅炖煮能更好保温锁味","story":"闽南地区秋冬滋补名菜，起源于泉州，后风靡厦门、台湾。老姜干煸出香后与番鸭同炖，姜的辛辣与鸭的鲜美完美融合。闽南人相信姜母鸭有驱寒暖身的功效，是冬至和冬日进补的首选。","link":"https://baike.baidu.com/item/姜母鸭","steps":"1.番鸭斩成4cm见方的块，冷水下锅加姜片、料酒焯水煮出血沫，捞出温水洗净沥干；2.老姜不用去皮，洗净后切成3mm厚的片（太薄容易焦，太厚不易出味）；3.干锅烧热不放油，下姜片中小火干煸约3分钟，不断翻动至姜片边缘微卷、表面微黄、姜香浓郁时盛出；4.锅中下油30ml烧热，放入煸过的姜片和鸭肉块，中大火煸炒约5分钟至鸭皮微黄、鸭油被逼出；5.加入冰糖25g炒至融化上色，沿锅边淋入米酒100ml、生抽30ml、老抽15ml，加入桂皮和八角翻炒均匀；6.将全部食材转入砂锅，加入开水没过鸭肉（约800ml），大火烧开撇去浮沫；7.加盖转小火慢炖1小时，中间翻动一次防止粘底，开盖尝味，大火收汁5分钟至汤汁浓稠挂在鸭块上即可"},
{"name":"海蛎煎","style":"闽南菜","taste":"鲜香软糯、外焦里嫩","mainIngredients":"海蛎 250g, 鸡蛋 3个, 番薯粉 80g, 小葱 3根","seasoning":"盐 4g, 白胡椒粉 2g, 甜辣酱 适量","difficulty":"简单","time":"20分钟","servings":"2-3人份","tips":"海蛎洗净后一定要沥干水分否则面糊太稀；番薯粉和水的比例约1:1调成流动浆状；全程中小火慢煎外焦里嫩","story":"闽南最具代表性的街头小吃，也是台湾蚵仔煎的前身。以新鲜海蛎搭配番薯粉和鸡蛋煎制，外焦里嫩。在闽南，海蛎煎是衡量一个小吃摊水平的标准——海蛎要鲜、粉要Q、蛋要香。","link":"https://baike.baidu.com/item/海蛎煎","steps":"1.海蛎放入漏网中用清水轻轻漂洗，挑去碎壳，沥干水分（一定要沥干！）；2.小葱切葱花；大碗中放入海蛎、番薯粉80g、水80ml、鸡蛋2个、葱花、盐4g、白胡椒粉2g，轻轻拌匀成流动的浆糊状；3.平底不粘锅倒入油40ml（油量要足），中火烧至五成热，将海蛎面糊全部倒入，用锅铲摊平成约2cm厚的圆饼；4.保持中小火慢煎约4-5分钟至底部定型金黄（可晃动锅子判断），用一个盘子扣在锅上辅助翻面；5.翻面后将剩余1个鸡蛋打散沿饼边淋入，继续煎3-4分钟至另一面也金黄焦香；6.两面煎好后出锅装盘，表面淋上闽南甜辣酱（或搭配甜辣酱碟蘸食），趁热吃外焦里嫩"},
{"name":"沙茶面","style":"闽南菜","taste":"沙茶香浓、鲜醇微辣","mainIngredients":"碱面 300g, 虾仁 100g, 鱿鱼 1条, 大肠 150g, 豆腐泡 100g, 青菜 150g","seasoning":"沙茶酱 50g, 花生酱 20g, 高汤 1L, 盐 4g, 蒜末 20g","difficulty":"简单","time":"25分钟","servings":"2-3人份","tips":"沙茶酱选厦门特产沙茶辣酱味道最正宗；花生酱以无糖纯花生酱为佳；汤底熬得浓一点才能挂上碱面","story":"厦门最具代表性的面食，由华侨从南洋带回的沙茶（Satay）酱料与闽南本地面食文化融合而成。浓郁的沙茶汤底配以丰富海鲜和卤味，是厦门人从小吃到大的灵魂美食，也是游客来厦必尝的第一碗面。","link":"https://baike.baidu.com/item/沙茶面","steps":"1.鱿鱼撕去外膜去内脏，切圈；大肠（提前卤熟的）切小段；豆腐泡对半切开；青菜摘洗干净；2.锅中下油20ml，小火爆香蒜末至微黄，加入沙茶酱50g和花生酱20g，小火不停搅拌炒1分钟至酱香融合、油色变红；3.倒入高汤1L搅拌均匀，中火烧开后转小火熬煮5分钟让酱香充分融入汤中，加盐4g调味；4.另起一锅水烧开，下碱面煮约2分钟至熟（碱面煮的时间比普通面短），捞出装入大碗；5.利用面汤水依次烫熟：鱿鱼圈30秒、虾仁40秒、青菜1分钟，豆腐泡放入沙茶汤中煮2分钟吸味；6.将烫好的海鲜、大肠、豆腐泡、青菜整齐码在面上，浇入滚烫的沙茶汤至没过面，撒上蒜末即可"},
{"name":"土笋冻","style":"闽南菜","taste":"Q弹爽滑、鲜咸原味","mainIngredients":"土笋 500g","seasoning":"酱油 20ml, 醋 15ml, 蒜末 10g, 芥末 少许, 香菜 适量","difficulty":"中等","time":"120分钟","servings":"4-6人份","tips":"土笋又称沙虫，是闽南特有的海产；煮的时候水不能太多否则胶质不够浓稠不凝固；全程小火慢熬至少1小时出胶","story":"闽南安海古镇独有的传统小吃，以海沙虫（土笋）熬煮出天然胶质后冷凝成冻。口感Q弹爽滑，蘸酱油醋蒜末芥末食用。外地人初见往往不敢下筷，但尝过之后多会上瘾。是闽南饮食文化中「化平凡为神奇」的典范。","link":"https://baike.baidu.com/item/土笋冻","steps":"1.土笋放入清水中加少许盐静养2小时让其吐沙，期间换水3-4次，直到水不再浑浊；2.将土笋捞出冲洗干净，用剪刀剪开腹部去除内脏，再反复搓洗至表面黏液洗净；3.土笋放入锅中加清水1.2L（水量刚好没过土笋），大火烧开撇去浮沫，立即转小火慢熬1小时至1小时20分钟，期间偶尔搅拌一下防止粘底；4.熬至汤色奶白、用手指蘸汤能感觉明显黏稠（汤量约剩700ml），加少许盐调味；5.将熬好的土笋连汤一起倒入浅盘中（厚度约2-3cm），用筷子将土笋在汤中均匀分布，静置至室温后放入冰箱冷藏2小时凝固成冻；6.取出凝固好的土笋冻，用刀切成3cm见方的方块装盘；7.蘸料：小碗中混合酱油20ml、醋15ml、蒜末10g、少许芥末，撒香菜末，土笋冻蘸食Q弹爽滑"},
{"name":"同安封肉","style":"闽南菜","taste":"肥而不腻、咸香入味","mainIngredients":"三层五花肉 600g, 香菇 8朵, 虾米 20g, 板栗 100g","seasoning":"生抽 30ml, 老抽 10ml, 冰糖 20g, 料酒 20ml, 八角 2个, 桂皮 1小块","difficulty":"中等","time":"100分钟","servings":"4-5人份","tips":"五花肉选三层分明的最佳，肉块蒸之前煎至表面微黄能锁住肉汁；倒扣装盘是这道菜的仪式感所在","story":"厦门同安区的招牌名菜，源于闽南农村宴席上「封」的烹饪技法——将食材封在碗中隔水蒸制。同安人每逢喜事必有封肉，肉烂味香、肥而不腻，是闽南乡土宴席菜的灵魂之作。","link":"https://baike.baidu.com/item/同安封肉","steps":"1.选带皮三层五花肉整块冷水下锅焯水10分钟至断生，捞出用温水冲洗，用刀刮净猪皮表面；2.猪皮面抹上老抽上色，平底锅放少许油，将猪皮面朝下煎至起泡微黄（约2分钟），其余各面也略煎上色；3.五花肉切成5cm见方的大块但保持底部相连（或直接切厚片）；4.取深碗一个，碗底铺一层泡发的香菇（去蒂）、虾米和去壳板栗，将五花肉猪皮面朝下整齐码入碗中；5.调汁：生抽30ml、老抽5ml、冰糖20g、料酒20ml、八角、桂皮加清水100ml搅匀，淋入碗中至约八分满；6.用锡纸或盘子盖住碗口防止水汽进入，放入蒸锅，水开后隔水大火蒸90分钟；7.取出后先将碗中的汤汁倒出备用，将碗倒扣在盘中，周围摆上蒸熟的板栗和香菇，淋上汤汁即可"},
{"name":"闽南卤鸭","style":"闽南菜","taste":"卤香浓郁、肉质鲜嫩","mainIngredients":"鸭 半只(约1kg), 鸭翅 4只, 鸭爪 6只","seasoning":"卤料包 1个, 生抽 50ml, 老抽 20ml, 冰糖 30g, 料酒 30ml, 生姜 25g","difficulty":"中等","time":"80分钟","servings":"4-5人份","tips":"卤料包可用：八角2个、桂皮1块、香叶3片、草果1个、丁香3粒、花椒10g装入纱布袋；卤好后浸泡10分钟让味道渗入骨髓","story":"闽南家庭最常见的冷盘菜，卤味在闽南饮食中占有重要地位。卤鸭色泽红亮、肉质紧实，可热食也可做冷盘下酒。闽南人拜拜（祭祖）时的供品中常有一只卤鸭，寓意压得住阵、撑得起场面。","link":"https://baike.baidu.com/item/闽南卤鸭","steps":"1.鸭半只斩大块，鸭翅鸭爪洗净，所有鸭货冷水下锅加姜片、料酒15ml焯水5分钟煮出血沫，捞出温水洗净沥干；2.取深锅下少许油，小火爆香姜片至微黄，加入冰糖30g炒至融化呈浅琥珀色；3.放入鸭块中火翻炒3分钟至鸭皮微微收紧上色，沿锅边淋入料酒15ml和生抽50ml、老抽20ml；4.加入足量开水没过所有鸭货（约1.5L），放入卤料包，大火烧开撇去浮沫；5.加盖转小火慢卤60分钟，中间翻动1-2次使所有部位卤制均匀；6.用筷子戳鸭腿最厚处能轻松穿透即熟，关火不要急着捞出，盖盖浸泡10分钟让卤味充分渗入；7.捞出斩件装盘，可淋上适量卤汁增味"},
{"name":"炸五香","style":"闽南菜","taste":"外酥里嫩、鲜香可口","mainIngredients":"猪肉馅 300g, 豆皮 3张, 荸荠 100g, 香菇 6朵","seasoning":"盐 4g, 生抽 15ml, 五香粉 5g, 淀粉 25g, 食用油 适量","difficulty":"中等","time":"30分钟","servings":"3-4人份","tips":"荸荠不要切太碎保留颗粒感口感更好；豆皮卷一定要卷紧实否则炸时会散开；油温先低后高两次炸更酥脆","story":"闽南传统炸物小吃，以豆皮包裹五香调味肉馅炸至金黄酥脆。是闽南人过年必备的年货之一，也是街头小吃摊和卤味店的常驻单品。外酥里嫩、五香浓郁，蘸甜辣酱食用风味更佳。","link":"https://baike.baidu.com/item/五香卷","steps":"1.荸荠去皮切成小丁（保留颗粒感），香菇泡发切丁，与猪肉馅一起放入大碗中；2.加入盐4g、生抽15ml、五香粉5g、淀粉25g、蒜末10g朝一个方向用力搅打5分钟至上劲起胶；3.豆皮铺平在案板上，用湿布轻轻擦拭使其回软，沿长边放入适量馅料整形成长条状（直径约3cm）；4.将豆皮紧紧卷起包裹馅料，收口处涂少许水淀粉黏合，用牙签固定两端，每条长约15cm；5.将卷好的五香卷切成5cm长的小段；6.锅中倒油烧至150℃（五成热），下五香段中小火炸约4分钟至表面浅黄定型捞出；7.将油温升至180℃，复炸约1分钟至表面金黄酥脆，捞出控油，搭配闽南甜辣酱蘸食"},
{"name":"闽南薄饼","style":"闽南菜","taste":"鲜香清爽、口感丰富","mainIngredients":"薄饼皮 10张, 五花肉 150g, 胡萝卜 100g, 豆干 100g, 豆芽 120g, 海蛎 100g","seasoning":"盐 5g, 生抽 15ml, 蒜末 10g, 甜辣酱 适量","difficulty":"中等","time":"40分钟","servings":"3-4人份","tips":"薄饼皮买现成的为佳；每种食材分开炒熟再组合能保持各自风味；卷的时候要紧实但别撑破皮","story":"闽南地区清明节前后的传统食物，又称润饼、春卷。以薄如纸的面皮包裹十几种分别炒制的食材，是闽南人「包山包海」饮食哲学的体现。每种食材单独料理再合而为一，口感层次极为丰富。","link":"https://baike.baidu.com/item/闽南薄饼","steps":"1.五花肉切细丝，胡萝卜切细丝，豆干切细条，豆芽摘去根部洗净，海蛎洗净沥干；2.锅中少许油，下五花肉丝煸炒出油至微焦香，加少许生抽盛出；3.胡萝卜丝单独炒软加少许盐盛出；豆干丝煎至微黄盛出；豆芽焯水10秒断生沥干；4.海蛎加少许淀粉拌匀，平底锅下油煎至两面微黄成小饼状盛出切条；5.调味甜辣酱：甜辣酱30g加少许温水和蒜末调稀备用；6.取薄饼皮一张铺平，在靠近自己的一侧依次铺上五花肉丝、胡萝卜丝、豆干、豆芽、海蛎条；7.淋上适量甜辣酱，先将底部向上折起包裹馅料，再将左右两边向内折，然后紧紧卷起即可食用"},
{"name":"面线糊","style":"闽南菜","taste":"鲜香浓稠、入口顺滑","mainIngredients":"面线 150g, 虾仁 80g, 海蛎 100g, 瘦肉 80g, 香菇 5朵","seasoning":"盐 6g, 生抽 15ml, 胡椒粉 3g, 葱花 适量, 香油 5ml","difficulty":"简单","time":"25分钟","servings":"2-3人份","tips":"面线本身有咸味，调味时盐要少放后尝味调整；面线煮的时间不能超过5分钟否则会糊烂","story":"闽南最接地气的早餐和夜宵，以极细的面线在鲜汤中煮至浓稠糊状，配料随心搭配。泉州和厦门的面线糊各有拥趸，泉州派偏重醋和胡椒粉，厦门派配料更丰富。配一根油条是闽南人最经典的早餐打开方式。","link":"https://baike.baidu.com/item/面线糊","steps":"1.面线用剪刀剪成约10cm长段（方便食用），温水浸泡5分钟回软沥干；2.瘦肉切细丝加少许生抽和淀粉抓匀腌5分钟，香菇泡发切丝，虾仁挑去虾线，海蛎洗净沥干；3.锅中加入高汤或清水1.2L，放入香菇丝大火烧开转中火煮3分钟出香；4.下瘦肉丝滑散煮至变色（约1分钟），加入虾仁和海蛎煮1分钟至海鲜变色；5.将泡软的面线均匀撒入锅中，用筷子轻轻拨散，中小火煮3分钟至面线完全透明柔软；6.加入盐6g、生抽15ml、白胡椒粉3g调味，淋入少许水淀粉勾薄芡使汤汁微稠；7.关火淋香油5ml，撒葱花，盛入碗中趁热食用，闽南人常配油条同吃"},
{"name":"花生汤","style":"闽南菜","taste":"香甜绵密、温润可口","mainIngredients":"花生 200g, 冰糖 60g","seasoning":"牛奶 100ml（可选）","difficulty":"简单","time":"90分钟","servings":"3-4人份","tips":"花生必须提前浸泡去皮，不去皮会有涩味；煮花生要冷水下锅小火慢熬口感才绵密；冰糖最后加避免久煮变酸","story":"闽南传统甜品，以去皮花生慢火熬煮至入口即化。是闽南婚宴和节庆中最常见的甜汤，寓意「好事发生」。厦门黄则和花生汤传承百年，是游客必打卡的厦门味道。","link":"https://baike.baidu.com/item/花生汤","steps":"1.花生200g放入大碗中加冷水浸泡4小时以上（或冷藏过夜），泡至花生粒饱满涨大；2.将泡好的花生逐个搓去红色外衣（泡软后轻轻一搓即掉），去皮后的花生白净饱满；3.将去皮花生放入锅中，加冷水1.5L，大火烧开后转为最小火（保持汤面微微冒泡），加盖慢煮1小时；4.煮至花生粒用手指轻捏即碎、口感绵密时加入冰糖60g，继续小火煮20-30分钟至冰糖完全融化、花生呈软糯状态；5.如果喜欢奶香，可在关火前加入牛奶100ml搅匀再加热1分钟（不要煮沸）；6.关火后静置5分钟让味道更加融合，温食或冷食均可（冷藏后别有风味）"},
{"name":"客家酿豆腐","style":"闽西菜","taste":"咸香鲜嫩、汤汁浓郁","mainIngredients":"嫩豆腐 1盒(约400g), 猪肉馅 200g, 香菇 5朵, 葱花 适量","seasoning":"盐 5g, 生抽 20ml, 蚝油 15ml, 淀粉 20g, 姜末 10g","difficulty":"中等","time":"45分钟","servings":"3-4人份","tips":"豆腐选嫩豆腐（南豆腐）口感最好但操作要轻防止碎裂；挖洞时留底和留边至少5mm否则煎时会漏馅","story":"闽西客家最具代表性的菜肴之一。客家先民从中原南迁后，以豆腐替代北方饺子的面皮，将肉馅「酿」入豆腐中。这道菜体现了客家人因地制宜、不忘故土的饮食智慧，是客家「酿」文化的经典代表。","link":"https://baike.baidu.com/item/客家酿豆腐","steps":"1.嫩豆腐切成5cm×5cm×3cm的方块，用小勺在每块豆腐中间挖出一个约2cm深的小洞（底部和四壁保留5mm厚度，切勿挖穿）；2.挖出的碎豆腐捏碎加入猪肉馅中不浪费；3.猪肉馅加香菇丁、姜末、盐3g、生抽10ml、淀粉10g、葱花朝一个方向搅打上劲；4.将馅料逐一填入豆腐洞中，轻轻压实使表面与豆腐齐平或略凸起；5.平底锅下油30ml中火烧热，将酿好的豆腐肉馅面朝下放入，煎约3分钟至肉馅金黄定型；6.用铲子小心翻面（豆腐面朝下），再煎2分钟至豆腐微黄；7.调芡汁：蚝油15ml、生抽10ml、水100ml、淀粉10g搅匀淋入锅中，加盖小火焖煮8-10分钟至汤汁浓郁，收汁撒葱花出锅"},
{"name":"梅菜扣肉","style":"闽西菜","taste":"咸香软糯、肥而不腻","mainIngredients":"五花肉 500g, 梅干菜 100g","seasoning":"生抽 25ml, 老抽 15ml, 冰糖 20g, 料酒 20ml, 八角 2个, 姜葱 各15g","difficulty":"中等","time":"120分钟","servings":"4-5人份","tips":"五花肉一定要煮至断生再炸皮才能起虎皮纹；梅干菜有多咸先用清水泡洗去咸味；蒸的时间越久越软糯入味","story":"客家经典菜肴，五花肉经煮、炸、蒸三道工序制成，猪皮呈现诱人的虎皮纹。梅干菜是客家人保存蔬菜的智慧结晶，与五花肉同蒸，菜吸肉油、肉吸菜香，是客家人待客的最高礼遇之一。","link":"https://baike.baidu.com/item/梅菜扣肉","steps":"1.五花肉整块冷水下锅，加姜片、料酒大火煮开后转中火煮20分钟至筷子能戳透猪皮（断生），捞出用叉子在猪皮上均匀扎孔；2.猪皮面趁热抹上老抽约8ml上色，晾干5分钟；3.锅中下油（能没过猪皮即可）烧至170℃，将五花肉猪皮面朝下放入炸约2分钟至表皮起泡呈虎皮状，捞出放入冷水中浸泡10分钟使皮回软起皱；4.梅干菜提前用清水泡1小时，反复换水搓洗去除多余咸味和泥沙，挤干水分后切碎；5.锅中少许油下姜葱末和八角炒香，加入梅干菜碎翻炒2分钟，加生抽10ml、冰糖10g调味盛出；6.五花肉切成8mm厚的片（保持每一片都带皮），在碗中整齐码放猪皮朝下，铺上炒好的梅干菜压紧，淋入生抽15ml、老抽7ml、料酒和剩余冰糖调成的汁；7.盖盘或锡纸，入蒸锅隔水大火蒸90分钟，取出倒扣在盘中，之前蒸出的汤汁倒入锅中勾薄芡淋在肉上即可"},
{"name":"闽西八大干之豆腐干","style":"闽西菜","taste":"咸香有嚼劲、越嚼越香","mainIngredients":"豆腐干 250g, 青椒 1个, 红椒 1个, 蒜苗 2根","seasoning":"生抽 15ml, 盐 2g, 蒜末 15g, 干辣椒 3个","difficulty":"简单","time":"20分钟","servings":"2-3人份","tips":"闽西豆腐干本身有咸味和嚼劲，炒的时候不要加水保持干香；干辣椒炝锅是提味关键","story":"闽西八大干之一——长汀豆腐干，始于唐朝，传承千年。长汀豆腐干以酸浆点卤、炭火烘烤制成，质地紧实有嚼劲。可直接食用也可炒菜，是闽西客家人佐餐下酒的必备干货。","link":"https://baike.baidu.com/item/长汀豆腐干","steps":"1.闽西豆腐干切成5mm宽的条，青椒和红椒去籽切同样粗细的条，蒜苗斜刀切段将蒜白和蒜叶分开；2.干辣椒剪成小段去籽，蒜头剁末；3.锅中下油25ml中小火烧热，下干辣椒段和蒜末煸至辣椒变深红色、蒜香飘出；4.下豆腐干条中火翻炒3分钟至豆腐干表面微微起焦斑、干香四溢；5.先下蒜苗白部分和青红椒条翻炒1分钟至辣椒断生；6.淋入生抽15ml、盐2g，加入蒜苗叶部分，大火快速翻炒30秒，所有食材均匀裹上酱色即可出锅"},
{"name":"客家焖鸡","style":"闽西菜","taste":"鲜香浓郁、鸡肉紧实","mainIngredients":"土鸡 半只(约800g), 香菇 8朵, 笋干 80g","seasoning":"生抽 30ml, 老抽 10ml, 料酒 25ml, 冰糖 15g, 姜葱 各20g, 八角 2个","difficulty":"中等","time":"100分钟","servings":"4-5人份","tips":"土鸡比饲料鸡紧实但需要更长烹饪时间；笋干需提前泡发至少4小时否则会有硬芯；焖煮期间不要频繁开盖","story":"闽西客家山区传统菜，选用在山间放养的土鸡，搭配闽西特产的笋干和香菇长时间焖煮。鸡肉紧实鲜香、汤汁浓郁，体现了客家人善用山珍和家禽的烹饪传统。","link":"https://baike.baidu.com/item/客家焖鸡","steps":"1.土鸡斩成4cm块，冷水下锅加姜片和料酒15ml焯水5分钟，捞出温水洗净沥干；2.干香菇提前2小时泡发去蒂切厚片，笋干提前4小时泡发后切片焯水3分钟去涩味；3.炒锅下油30ml烧热，下姜片和葱白段小火炸至微黄出香，加入八角2个；4.下鸡块中大火煸炒约5分钟至鸡皮微黄、鸡肉表面收紧，逼出鸡油；5.沿锅边淋入料酒10ml激香，加入生抽30ml、老抽10ml、冰糖15g翻炒至上色均匀；6.加入香菇片和笋干片翻炒1分钟，倒入开水至没过所有食材（约600ml）；7.大火烧开后转入砂锅或加盖，转小火焖煮80分钟至鸡肉酥软但不散烂，中间翻动一次；8.开盖尝味调整咸淡，大火收汁5分钟至汤汁挂在鸡块上，撒葱段装盘"},
{"name":"炒老鼠干","style":"闽西菜","taste":"咸香浓郁、有嚼劲","mainIngredients":"老鼠干 200g, 青椒 1个, 红椒 1个, 蒜苗 2根","seasoning":"蒜末 15g, 干辣椒 4个, 生抽 15ml, 盐 2g","difficulty":"简单","time":"25分钟","servings":"2-3人份","tips":"老鼠干是闽西八大干之一（田鼠干），食用前需充分泡发至少2小时去除烟熏味和咸味；炒制时尽量少加水保持干香口感","story":"闽西八大干中最为独特的一款——宁化老鼠干，实为田鼠经烟熏制成。宁化是山区农业县，秋收后田鼠肥美，当地人将其熏制成干货，与辣椒同炒，咸香耐嚼。是闽西客家饮食中大胆而智慧的蛋白质来源。","link":"https://baike.baidu.com/item/宁化老鼠干","steps":"1.老鼠干提前用温水浸泡2小时至回软，泡去多余的烟熏味和咸味，换水2-3次；2.泡好的老鼠干沥干，用剪刀剪成3cm长的小段，去除较大的骨头；3.青椒和红椒去籽切条，蒜苗斜刀切段；4.炒锅烧热下油25ml，小火下干辣椒段和蒜末煸至辣椒变色飘香；5.下老鼠干段中火煸炒5分钟至表面微焦、香味充分释放，利用热油将水分炒干；6.加入青红椒条和蒜苗白部分翻炒2分钟至配菜断生；7.沿锅边淋入生抽15ml，撒盐2g调味，加入蒜苗叶大火翻炒30秒即可出锅"},
{"name":"客家酿苦瓜","style":"闽西菜","taste":"苦中带鲜、清爽解腻","mainIngredients":"苦瓜 2根(约400g), 猪肉馅 250g, 香菇 5朵, 葱花 适量","seasoning":"盐 5g, 生抽 15ml, 淀粉 15g, 姜末 10g","difficulty":"中等","time":"40分钟","servings":"3-4人份","tips":"苦瓜选表皮颗粒大、颜色翠绿的苦味适中；苦瓜焯水10秒可去部分苦味但保留回甘；馅料打上劲后冷藏20分钟更紧实不散","story":"客家「酿」文化的重要成员，以苦瓜为容器填入肉馅煎焖而成。苦瓜的微苦与肉馅的鲜甜形成美妙对比，回甘悠长。客家人以苦瓜清热解暑，是夏季餐桌上的常客。","link":"https://baike.baidu.com/item/客家酿苦瓜","steps":"1.苦瓜洗净切去头尾，切成2.5cm厚的段，用小勺挖去中间的白色瓤和籽（白瓤是苦味主要来源，尽量刮干净）；2.锅中水烧开加少许盐和油，下苦瓜段焯水30秒捞出过冷水（去部分苦味并保持翠绿），沥干备用；3.猪肉馅加香菇丁、姜末、盐3g、生抽10ml、淀粉10g、葱花朝同一方向用力搅打5分钟至起胶，放入冰箱冷藏20分钟使馅料紧实；4.将肉馅填入每个苦瓜段中间的洞里，两面略凸起压实；5.平底锅下油25ml中火烧热，将酿苦瓜平放锅中，先煎一面约3分钟至肉馅金黄定型，翻面再煎2分钟；6.加入清水100ml和生抽5ml，加盖小火焖煮20分钟至苦瓜软糯入味（用筷子能轻松穿透苦瓜壁）；7.开盖大火收汁1-2分钟至汤汁浓稠裹在苦瓜上，撒葱花装盘"},
{"name":"莆仙卤面","style":"莆仙菜","taste":"鲜香浓稠、料足味厚","mainIngredients":"粗面条 300g, 虾仁 80g, 干贝 30g, 香菇 6朵, 五花肉 100g, 小白菜 150g, 胡萝卜 50g","seasoning":"生抽 20ml, 盐 5g, 淀粉 15g, 葱蒜 各15g, 香油 5ml","difficulty":"中等","time":"40分钟","servings":"3-4人份","tips":"莆仙卤面的精髓在于「卤」——汤汁要浓稠能挂在面条上；粗面条小火焖煮过程中会释放淀粉自然增稠","story":"莆田最具代表性的主食，与北方打卤面有异曲同工之妙。莆田人将海鲜的鲜味与面条的麦香在小火慢焖中融为一体，汤汁浓稠能挂在每根面条上。是莆田人待客的最高礼遇——「卤面待客，心意最足」。","link":"https://baike.baidu.com/item/莆田卤面","steps":"1.干贝提前2小时用清水泡发后撕成丝，香菇泡发切片，五花肉切薄片，胡萝卜切丝，小白菜切段；2.炒锅下油15ml，放入五花肉片中火煸炒出油至微焦色，下葱蒜末爆香；3.加入香菇片、干贝丝、胡萝卜丝翻炒1分钟出香，下虾仁翻炒至变色；4.加入开水1.2L大火烧开，下粗面条用筷子拨散，加盖转中小火焖煮5分钟；5.开盖翻动面条防止粘底，继续焖5分钟至面条八分熟、汤汁开始变稠；6.加入小白菜段煮1分钟至断生，加生抽20ml、盐5g调味；7.调水淀粉（淀粉15g+水30ml）淋入锅中，轻轻搅匀使汤汁进一步浓稠能挂在面条上，淋香油5ml关火盛碗"},
{"name":"兴化米粉炒米粉","style":"莆仙菜","taste":"干爽鲜香、咸淡适中","mainIngredients":"兴化米粉 250g, 鸡蛋 2个, 胡萝卜 60g, 豆芽 120g, 韭菜 50g, 瘦肉丝 100g","seasoning":"生抽 18ml, 盐 3g, 胡椒粉 2g, 葱蒜 各15g","difficulty":"简单","time":"20分钟","servings":"2-3人份","tips":"米粉泡软时间约5-8分钟即可，太软炒时会碎；全程大火快炒保持干爽不粘锅；兴化米粉极细，筷子比锅铲更好操作","story":"兴化米粉是莆田特产，始于宋代，已有千年历史。米粉洁白如雪、细如发丝，是中国最细的米粉之一。莆田人炒米粉讲究「干爽根根分明」，是莆田最具代表性的日常主食。","link":"https://baike.baidu.com/item/兴化米粉","steps":"1.兴化米粉放入温水浸泡5-8分钟至微软但仍保持弹性，捞出沥干水分（用手捏能感觉到回弹即可）；2.鸡蛋打散加少许盐搅匀，平底锅下油炒熟盛出切条；3.瘦肉切细丝加少许生抽和淀粉抓匀腌制5分钟，胡萝卜切细丝，豆芽摘根洗净，韭菜切段；4.炒锅大火烧热下油30ml，爆香葱蒜末，下瘦肉丝滑炒至变色盛出；5.锅中补少许油，下胡萝卜丝翻炒30秒，加入豆芽翻炒30秒至断生；6.转最大火下泡好的米粉，用筷子配合锅铲快速抖散翻炒，确保每根米粉都接触到锅底受热；7.沿锅边淋入生抽18ml、盐3g、胡椒粉2g，加入炒好的肉丝、鸡蛋和韭菜段，继续大火翻炒2分钟至米粉干爽飘香、根根分明出锅"},
{"name":"莆田温汤羊肉","style":"莆仙菜","taste":"鲜嫩不膻、温润滋补","mainIngredients":"羊肉 600g, 生姜 30g, 当归 10g","seasoning":"盐 6g, 料酒 25ml, 葱花 适量, 白胡椒粉 3g","difficulty":"中等","time":"120分钟","servings":"3-4人份","tips":"羊肉选带皮带骨的前腿肉最适合炖汤；当归量不宜多否则药味过重盖过羊肉鲜味；焯水后用温水洗净不能用冷水","story":"莆田传统滋补汤品，以山羊肉加当归生姜温火慢炖。莆田民间有「冬吃羊肉夏吃姜」的养生传统，温汤羊肉汤色奶白、肉质鲜嫩，是莆田人冬季进补和产妇坐月子的首选滋补汤。","link":"https://baike.baidu.com/item/温汤羊肉","steps":"1.羊肉斩成5cm块，冷水浸泡30分钟泡出血水，中途换水2次；2.羊肉冷水下锅加姜片15g、料酒15ml，大火煮开后继续煮3分钟至浮沫大量涌出，捞出用温水冲洗干净（忌用冷水冲洗否则肉质紧缩）；3.取砂锅或厚底汤锅，放入焯好的羊肉、姜片15g、当归10g（掰小块），加入足量开水1.8L没过羊肉约5cm；4.大火烧开撇去残余浮沫至汤面清澈，转小火加盖慢炖1.5小时，期间不要加水；5.炖至用筷子能轻松戳透羊肉、汤色奶白，加盐6g、料酒10ml、白胡椒粉3g调味；6.关火撒葱花，连汤带肉盛入汤碗中，可搭配蘸料（生抽+蒜末+醋）蘸食羊肉"},
{"name":"莆仙焖豆腐","style":"莆仙菜","taste":"鲜香软糯、汤汁浓稠","mainIngredients":"老豆腐 400g, 虾仁 80g, 干贝 25g, 香菇 5朵, 五花肉 80g","seasoning":"生抽 20ml, 盐 4g, 淀粉 12g, 葱蒜 各15g, 香油 5ml","difficulty":"中等","time":"45分钟","servings":"3-4人份","tips":"豆腐用手掰成大块比刀切更易入味（不规则断面吸附汤汁更强）；焖煮过程尽量少翻动以免豆腐碎散","story":"莆田乡土菜的代表，将豆腐与海鲜、五花肉同焖，豆腐充分吸收汤汁后变得软糯鲜美。是莆田农村宴席上常见的一道家常大菜，也是素食与荤食的完美结合。","link":"https://baike.baidu.com/item/莆仙焖豆腐","steps":"1.老豆腐用手掰成4cm左右的不规则大块（手掰的粗糙表面比刀切更能吸收汤汁）；2.干贝提前泡发撕丝，香菇泡发切片，五花肉切薄片，虾仁挑虾线备用；3.平底锅下油20ml，放入豆腐块中火煎约4分钟，底面微黄后用铲子小心翻面再煎3分钟，表面微黄定型后盛出；4.同锅下五花肉片中火煸炒出油至微焦，下葱蒜末和香菇片爆香；5.加入虾仁和干贝丝翻炒1分钟至海鲜变色出香；6.将煎好的豆腐轻轻放回锅中，加入开水400ml（约与豆腐齐平），生抽20ml、盐4g，轻轻推动使调料均匀分布；7.加盖小火焖煮30分钟至豆腐吸饱汤汁变得软糯，开盖淋入水淀粉（淀粉12g+水30ml）勾芡，淋香油5ml，轻轻推匀撒葱花出锅"},
{"name":"兴化炒米粉","style":"莆仙菜","taste":"鲜香干爽、根根分明","mainIngredients":"兴化米粉 250g, 瘦肉 80g, 虾仁 80g, 香菇 5朵, 青菜 150g","seasoning":"生抽 18ml, 盐 3g, 胡椒粉 2g, 葱蒜 各15g","difficulty":"简单","time":"20分钟","servings":"2-3人份","tips":"兴化米粉是莆田特产极细米粉，泡水时间需严格控制；炒米粉的秘诀是油量适中+大火快炒+勤翻","story":"兴化米粉是莆田千年特产，中国最细的米粉之一。莆田人炒米粉讲究火候和手法，用筷子而非锅铲翻炒才能保证米粉根根分明不断裂。是海外莆田侨胞最思念的家乡味道。","link":"https://baike.baidu.com/item/兴化米粉","steps":"1.兴化米粉放入温水（约40℃）中浸泡5-6分钟至微软有弹性，捞出充分沥干（可用厨房纸吸去多余水分）；2.瘦肉切细丝加生抽和淀粉抓匀腌制5分钟，虾仁挑去虾线，香菇泡发切丝，青菜切段；3.炒锅大火烧热下油30ml，爆香葱蒜末，下瘦肉丝滑炒至变色盛出；4.锅中下香菇丝煸炒出香，下虾仁炒至变红卷曲盛出；5.锅中补少许油，转最大火下米粉用筷子快速抖散，不断翻炒均匀受热约2分钟；6.加入炒好的肉丝、虾仁、香菇丝和青菜段，淋入生抽18ml沿锅边，加盐3g和胡椒粉2g；7.大火继续翻炒1-2分钟至青菜断生、米粉干爽飘香，根根分明即可出锅"},
{"name":"莆田兴化扁食","style":"莆仙菜","taste":"皮薄馅嫩、汤鲜可口","mainIngredients":"扁食皮 200g, 猪肉馅 250g, 葱花 适量","seasoning":"盐 5g, 生抽 15ml, 香油 5ml, 白胡椒粉 3g","difficulty":"中等","time":"25分钟","servings":"3-4人份","tips":"扁食皮比普通馄饨皮更薄，包时手法要轻；肉馅朝一个方向搅打上劲口感才Q弹；煮扁食水要多火要大","story":"莆田兴化府传统小吃，与福州肉燕并称福建两大名小吃。扁食皮比普通馄饨皮更薄更滑，馅料以猪肉为主，汤清味鲜。莆田人早餐一碗扁食汤配煎包，是开启一天的标准方式。","link":"https://baike.baidu.com/item/兴化扁食","steps":"1.猪肉馅（七分瘦三分肥）加生抽10ml、盐2g、白胡椒粉1g、少许葱姜水（姜末+葱末+水浸泡的水），朝一个方向用力搅打5分钟至上劲起胶、筷子能立住；2.取扁食皮一张放在掌心，用筷子挑约8g肉馅放在皮中央，将皮对折捏紧收口，轻压使馅料均匀铺开，形似小元宝；3.依次包完所有扁食，放在撒了干粉的盘子上防止粘连；4.锅中加足量清水1.5L大火烧至沸腾，将扁食沿锅边滑入，用勺背轻轻推动防止粘底；5.保持大火煮约3-4分钟至扁食全部浮上水面、皮变得半透明、内部馅料颜色变深即熟透；6.汤碗中加盐3g、生抽5ml、白胡椒粉2g、香油5ml，连汤带扁食盛入碗中，撒上葱花即可"},
{"name":"白灼虾","style":"福州菜","taste":"鲜甜原味、Q弹爽口","mainIngredients":"鲜活对虾 500g","seasoning":"生姜 20g, 葱白 2根, 盐 5g, 料酒 20ml, 芥末 适量, 酱油 30ml","difficulty":"简单","time":"10分钟","servings":"3-4人份","tips":"虾一定要鲜活，入锅前还在跳为最佳；水中加盐和料酒能去腥增鲜；煮的时间精确控制——虾变红身体弯曲即捞出","story":"福建沿海最经典的海鲜做法，以白水灼煮最大程度保留虾的原味。看似简单，但对虾的新鲜度和火候掌控要求极高。福州人吃白灼虾讲究蘸芥末酱油，鲜甜Q弹、一口一只。","link":"https://baike.baidu.com/item/白灼虾","steps":"1.鲜活对虾剪去虾须和虾枪，用牙签从虾背第二关节处挑出虾线，清水快速冲洗沥干；2.取深锅加清水1.5L，放入姜片20g、葱白段、盐5g、料酒20ml，大火烧开煮1分钟让姜葱味融入水中；3.水滚沸时将处理好的虾一次性倒入，用漏勺轻轻推散使受热均匀；4.保持大火煮约2分钟，观察虾身：颜色由灰变红、虾身弯曲呈C形、浮上水面即熟透（不可煮太久否则虾肉变老）；5.立即用漏勺捞出放入冰水中浸泡30秒（冰镇使虾肉更加Q弹紧实）；6.沥干装盘，蘸料碟中调芥末酱油（酱油30ml+芥末少许搅匀），剥壳蘸食鲜甜弹牙"},
{"name":"清蒸石斑鱼","style":"福州菜","taste":"鲜嫩爽滑、原汁原味","mainIngredients":"石斑鱼 1条(约600g), 生姜 25g, 葱白 2根","seasoning":"生抽 25ml, 料酒 15ml, 香油 5ml, 葱花 适量","difficulty":"中等","time":"20分钟","servings":"3-4人份","tips":"石斑鱼选鲜活的蒸出来才鲜嫩；鱼身划刀不要太深否则蒸时会断裂；蒸好后的腥水一定要倒掉","story":"福州高档宴席中鱼类菜肴的标杆。石斑鱼是福建沿海名贵海鱼，肉质细嫩洁白。清蒸是福州人对好鱼最高的敬意——用最少的调料、最短的时间，呈现鱼肉最本真的鲜美。","link":"https://baike.baidu.com/item/清蒸石斑鱼","steps":"1.石斑鱼请鱼贩处理干净（刮鳞去鳃去内脏），回家冲洗后在鱼身两面各斜划三刀（深至鱼骨约1cm），在刀口处塞入姜片；2.鱼身内外抹上料酒15ml和少许盐腌制5分钟去腥；3.蒸盘底部铺一层姜片和葱段将鱼架空（使蒸汽流通鱼身受热均匀）；4.蒸锅水烧至滚沸后将鱼盘放入，加盖大火蒸10-12分钟（600g鱼的标准时间，每增减100g调整约1分钟）；5.关火后不要立即开盖，虚蒸2分钟让鱼肉利用余温完成最后的熟化；6.取出鱼盘，倒掉蒸出的腥水（这一步很关键），拣去鱼身上的姜片和葱段；7.在鱼身上重新铺上新鲜葱丝和姜丝，淋入生抽25ml和香油5ml；8.另起锅烧油25ml至微微冒烟（约200℃），热油浇在葱姜丝上激出滋啦声和浓郁葱香，立即上桌"},
{"name":"糟炒鸡杂","style":"福州菜","taste":"糟香浓郁、脆嫩可口","mainIngredients":"鸡胗 150g, 鸡肠 100g, 鸡心 100g, 青椒 1个, 红椒 1个","seasoning":"红糟 35g, 料酒 15ml, 盐 4g, 蒜末 15g, 生姜 15g","difficulty":"简单","time":"20分钟","servings":"2-3人份","tips":"鸡杂焯水时间要短（10秒）否则会变老；鸡肠用盐和面粉反复搓洗去黏液；全程大火快炒保持脆嫩口感","story":"福州家常下酒小炒，将鸡杂以红糟急火快炒。物尽其用是福州饮食的一大特点——鸡的每个部位都不浪费。红糟的糟香与鸡杂的脆嫩相得益彰，是福州人佐酒下饭的实惠美味。","link":"https://baike.baidu.com/item/糟炒鸡杂","steps":"1.鸡胗去除黄色内膜切成薄片，鸡心对半切开洗净血块，鸡肠用盐和面粉反复搓洗3遍至无黏液后切段；2.锅中水烧开，鸡杂分别快速焯水10秒（鸡胗、鸡心、鸡肠各10秒），捞出过冷水沥干；3.青椒和红椒去籽切菱形片备用；4.红糟35g加料酒10ml调稀备用；5.炒锅大火烧热下油25ml，爆香姜片和蒜末至微黄；6.下鸡胗、鸡心、鸡肠大火猛炒30秒至表面微焦；7.倒入调稀的红糟翻炒均匀上色，加盐4g和剩余料酒调味；8.加入青红椒片大火翻炒30秒至断生即可出锅（保持脆嫩）"},
{"name":"闽南炸醋肉","style":"闽南菜","taste":"外酥里嫩、酸甜可口","mainIngredients":"猪里脊肉 350g","seasoning":"白醋 20ml, 白糖 35g, 盐 3g, 淀粉 50g, 料酒 15ml, 蒜末 15g","difficulty":"中等","time":"30分钟","servings":"3-4人份","tips":"里脊肉顺着纹路切条口感更嫩；第一次炸定型第二次复炸酥脆；糖醋汁熬到能挂在锅铲上为浓稠度最佳","story":"闽南经典糖醋菜肴，以白醋而非陈醋调味，酸甜清爽。与福州荔枝肉同属闽菜酸甜家族，但炸醋肉更强调醋的酸香而非番茄酱的甜。是闽南家庭餐桌上的高频率菜肴，冷食也别有风味。","link":"https://baike.baidu.com/item/炸醋肉","steps":"1.猪里脊肉切成手指粗细的条（约1cm×1cm×5cm），加料酒10ml、盐3g、蒜末10g抓匀腌制15分钟入味；2.腌好的肉条均匀裹上干淀粉（可用保鲜袋装淀粉和肉条摇晃使裹粉更均匀），抖去多余淀粉；3.锅中倒油烧至160℃，逐条下肉炸约3分钟至表面浅黄定型捞出；4.将油温升至180℃，肉条复炸约40秒至表面金黄酥脆捞出控油；5.另取小碗调糖醋汁：白醋20ml、白糖35g、水30ml、少许水淀粉搅匀；6.锅中留底油5ml，小火下蒜末5g爆香，倒入糖醋汁中火加热不断搅拌，熬至冒大泡汤汁明显变稠；7.倒入炸好的肉条大火快速翻拌15秒，使每根肉条均匀裹上亮晶晶的糖醋汁，立即出锅装盘"},
{"name":"闽西客家米粉蒸肉","style":"闽西菜","taste":"鲜香软糯、米粉吸味","mainIngredients":"五花肉 400g, 米粉 150g, 香菇 6朵","seasoning":"生抽 25ml, 老抽 8ml, 料酒 15ml, 盐 4g, 姜葱 各15g","difficulty":"中等","time":"60分钟","servings":"3-4人份","tips":"米粉用粗米粉比细米粉口感更好；肉片腌制时间至少20分钟才入味；蒸好后倒扣装盘汁水才不会流失","story":"闽西客家经典蒸菜，以米粉代替传统的粉蒸肉米粉，是客家人将主食与菜肴合二为一的智慧体现。蒸制过程中米粉充分吸收肉汁和油脂，变得油亮软糯，香味浓郁。","link":"https://baike.baidu.com/item/米粉蒸肉","steps":"1.五花肉切成6mm厚的片（稍厚口感好），加生抽20ml、老抽8ml、料酒15ml、盐3g、姜末、葱花抓匀腌制30分钟入味；2.米粉（粗米粉）用温水泡15分钟至微软，捞出沥干（不要太软）；3.香菇泡发切厚片，与腌好的肉片、泡软的米粉一起放入大碗中，轻轻拌匀使米粉和肉片均匀混合；4.取蒸碗，先在碗底整齐码放一层肉片（皮朝下美观），再将剩余的米粉和肉片混合物填入压紧；5.淋入生抽5ml和少许水在表面防止太干，碗口盖盘子或锡纸；6.蒸锅水烧开后放入蒸碗，大火蒸40分钟至肉片软糯、米粉完全吸收肉汁变得油亮；7.取出后倒扣在盘中，将碗中的汤汁淋在米粉蒸肉上，撒葱花点缀即可"},
{"name":"莆仙荔枝肉","style":"莆仙菜","taste":"酸甜酥脆、形似荔枝","mainIngredients":"猪里脊肉 300g, 马蹄 80g, 青椒 1个","seasoning":"番茄酱 30g, 白糖 25g, 白醋 15ml, 盐 3g, 淀粉 30g, 蒜末 15g","difficulty":"中等","time":"30分钟","servings":"3-4人份","tips":"与福州荔枝肉相比，莆仙版酱汁更偏酸甜，马蹄用量较少；剞花刀时刀距均匀才能炸出漂亮的荔枝花纹","story":"莆田版本的荔枝肉，与福州版同源但酱汁比例略有差异——莆仙版更偏酸甜口。莆田人做荔枝肉喜欢加青椒增加清香，马蹄用量较少突出肉感。是莆田宴席上的必备酸甜菜肴。","link":"https://baike.baidu.com/item/荔枝肉","steps":"1.猪里脊肉切成2cm见方小块，在每块表面剞十字花刀（刀距约2mm、深度约肉厚2/3），加盐、料酒和少许水淀粉抓匀腌制15分钟；2.马蹄去皮切成小块，青椒去籽切菱形片；3.腌好的肉块表面均匀裹上干淀粉，每个刀口缝隙都沾到粉，轻抖去多余粉；4.锅中油烧至170℃，将肉块逐一下锅，炸约2分钟至表面金黄、肉块卷曲形似荔枝外壳，捞出控油；5.油温升至180℃复炸30秒使外壳更加酥脆；6.调糖醋汁：番茄酱30g+白糖25g+白醋15ml+清水30ml+水淀粉10g搅匀；7.锅中留底油爆香蒜末，倒入糖醋汁中火烧至浓稠冒大泡，倒入炸肉块和马蹄青椒快速翻拌15秒，每块均匀裹汁立即出锅"},
{"name":"福州太平燕","style":"福州菜","taste":"鲜香可口、寓意吉祥","mainIngredients":"肉燕皮 200g, 猪肉馅 250g, 鸭蛋 2个, 青菜 150g","seasoning":"盐 6g, 生抽 15ml, 香油 5ml, 白胡椒粉 3g, 葱花 适量","difficulty":"中等","time":"25分钟","servings":"3-4人份","tips":"太平燕是福州宴席必备菜，鸭蛋寓意太平（鸭谐音压，压住太平）；肉燕皮需冷冻保存，用前提前回温；打鸭蛋入锅时火要小保持蛋形完整","story":"福州宴席上最重要的吉祥菜，肉燕搭配鸭蛋寓意「压乱太平」。福州人逢年过节、婚丧嫁娶必有太平燕，上桌时常伴鞭炮声。鸭蛋在福州话中与「压乱」谐音，吃太平燕寓意一年平安顺遂。","link":"https://baike.baidu.com/item/太平燕","steps":"1.猪肉馅加生抽10ml、盐2g、白胡椒粉1g、葱花、少许水朝一个方向用力搅打至上劲起胶；2.取肉燕皮铺在掌心，放约10g肉馅，将皮对折捏紧收口成燕尾形（或直接四角捏合）；3.包好的肉燕放在撒了干粉的盘中，每个之间留空隙防粘连；4.锅中加清水1.5L大火烧开，将肉燕沿锅边滑入煮约5分钟至浮起，转中小火；5.用勺子在汤中搅出漩涡，将鸭蛋轻轻打入漩涡中心，保持小火煮2-3分钟至蛋白凝固蛋黄仍嫩滑（溏心荷包蛋）；6.加入青菜煮1分钟断生，加盐4g、生抽5ml、白胡椒粉2g调味；7.淋香油，撒葱花，盛入碗中每人一颗太平蛋+几颗肉燕，寓意太平吉祥"},
{"name":"闽南姜母鸭面线","style":"闽南菜","taste":"姜香浓郁、面线顺滑","mainIngredients":"姜母鸭 300g, 面线 150g, 青菜 120g","seasoning":"盐 4g, 白胡椒粉 2g, 香油 5ml","difficulty":"简单","time":"20分钟","servings":"2-3人份","tips":"姜母鸭用之前做好的或买现成的即可；面线下锅后不要过度搅拌以免断碎；姜母鸭的汤汁是面线汤头的灵魂","story":"闽南人将姜母鸭的浓郁汤汁与面线结合而成的创意主食。姜母鸭的姜香酱香融入面线汤中，是冬季暖身的最佳选择。也是闽南人利用剩菜「翻新」的智慧体现——头天吃不完的姜母鸭第二天煮面线又是一道美味。","link":"https://baike.baidu.com/item/姜母鸭面线","steps":"1.姜母鸭（提前做好的）取出切块，连带汤汁一起放入锅中加适量水加热至沸腾；2.面线剪成10cm长段，温水泡5分钟回软沥干；3.姜母鸭汤烧开后调整水量至约1L（咸度刚好为宜），下面线煮3分钟至面线透明柔软；4.加入青菜段煮1分钟至断生；5.加盐4g（姜母鸭本身有咸味所以盐要少放后尝）、白胡椒粉2g调味；6.淋香油5ml，盛入大碗中，面线上铺几块姜母鸭肉和青菜，连汤带面趁热食用"},
{"name":"闽西酿茄子","style":"闽西菜","taste":"咸香软糯、汤汁浓郁","mainIngredients":"茄子 2根(约400g), 猪肉馅 200g, 香菇 5朵","seasoning":"生抽 20ml, 蚝油 15ml, 淀粉 15g, 蒜末 15g, 姜末 10g","difficulty":"中等","time":"40分钟","servings":"3-4人份","tips":"茄子选长条紫茄中间粗度均匀的；挖茄肉时底部留一层防止漏馅；煎茄子时油温要够否则茄子吸油过多","story":"客家「酿」系列的又一成员，以茄子为容器酿入肉馅。茄子在焖煮过程中充分吸收肉汁和酱汁，变得软糯入味。是客家人在蔬菜季将茄子「升华」的经典做法。","link":"https://baike.baidu.com/item/酿茄子","steps":"1.长茄子洗净去蒂，切成5cm长段，每段从中间用小刀挖出部分茄肉（底部保留约1cm厚度，挖成碗状）；2.挖出的茄肉切碎加入猪肉馅中不浪费；3.猪肉馅加香菇丁、姜末、盐2g、生抽10ml、淀粉8g、挖出的茄肉碎朝一个方向搅打上劲；4.将馅料填入茄子段的洞中压紧实，表面略凸起；5.平底锅下油35ml中大火烧热，将酿茄子肉馅面朝下放入煎约3分钟至肉馅金黄；6.翻面（茄子皮朝下）再煎2分钟；7.调汁：蚝油15ml、生抽10ml、清水100ml、淀粉7g搅匀淋入锅中，加盖小火焖煮15-18分钟至茄子软糯、汤汁浓郁，收汁撒葱花即可"},
{"name":"莆仙海蛎汤","style":"莆仙菜","taste":"鲜甜清爽、海味十足","mainIngredients":"海蛎 200g, 豆腐 200g, 青菜 120g, 虾皮 10g","seasoning":"盐 5g, 白胡椒粉 2g, 香油 5ml, 葱花 适量","difficulty":"简单","time":"15分钟","servings":"2-3人份","tips":"海蛎下锅后不宜久煮否则缩水变老；豆腐用手掰大块比刀切口感更好；虾皮是提鲜的关键","story":"莆田沿海最常见的家常汤品，以本地鲜海蛎搭配豆腐青菜，清爽鲜美。莆田人讲究「鲜不过海蛎汤」，一碗好海蛎汤汤清味鲜、海蛎饱满多汁，是莆田妈妈们最拿手的家常味道。","link":"https://baike.baidu.com/item/海蛎汤","steps":"1.海蛎用漏网在清水下轻轻漂洗，挑去碎壳杂质，沥干水分；2.老豆腐用手掰成3-4cm的不规则大块；3.锅中加清水1.2L，放入虾皮10g大火烧开煮2分钟让虾味融入汤中；4.下豆腐块中火煮3分钟至豆腐热透；5.放入海蛎和青菜段煮约1.5分钟，海蛎刚变色微微卷起即熟（不要久煮）；6.加盐5g、白胡椒粉2g调味，淋香油5ml；7.关火撒葱花盛碗，汤清味鲜海蛎饱满多汁"},
{"name":"福州红糟鱼","style":"福州菜","taste":"糟香鲜甜、鱼肉细嫩","mainIngredients":"草鱼 1条(约700g), 红糟 50g","seasoning":"料酒 25ml, 盐 5g, 生姜 20g, 葱白 2根, 白糖 10g","difficulty":"中等","time":"60分钟","servings":"3-4人份","tips":"草鱼选2斤左右的肉质最嫩；煎鱼前鱼身擦干水分防止粘锅破皮；焖煮时尽量少翻动鱼块以免散碎","story":"福州糟香系列的鱼类代表作。草鱼价廉物美，福州人以红糟烹之，赋予平凡的鱼肉浓郁的糟香和诱人的红色。是福州普通家庭餐桌上「花小钱吃大味」的典范。","link":"https://baike.baidu.com/item/红糟鱼","steps":"1.草鱼处理干净（刮鳞去鳃去内脏），斩成4cm宽的块，加料酒15ml和盐3g抹匀腌制15分钟入味去腥；2.腌好的鱼块用厨房纸吸干表面水分（防止煎时溅油和粘锅）；3.平底锅下油40ml烧至六成热，放入鱼块中小火煎至两面微黄（每面约2分钟），盛出备用；4.锅中留底油，下姜片和葱白段小火炸香，加入红糟50g和白糖10g中火翻炒约2分钟至红糟颜色变深、糟香四溢；5.沿锅边淋入料酒10ml激香，加入开水300ml搅匀煮沸；6.将煎好的鱼块轻轻放回锅中，使鱼块浸在红糟汤汁中，加盖小火焖煮35分钟；7.开盖尝味加盐2g调整，大火收汁3-5分钟至汤汁浓稠挂在鱼块表面，小心盛出装盘淋上糟汁"},
{"name":"闽南花生猪脚","style":"闽南菜","taste":"软糯鲜香、胶质满满","mainIngredients":"猪脚 1只(约800g), 花生 150g","seasoning":"生抽 30ml, 老抽 15ml, 冰糖 25g, 料酒 25ml, 姜葱 各20g, 八角 2个","difficulty":"中等","time":"120分钟","servings":"4-5人份","tips":"猪脚选前蹄（猪手）肉质更丰富、胶质更足；花生提前泡4小时以上；焖煮1.5小时是猪脚软糯的保证","story":"闽南传统滋补硬菜，猪脚与花生同炖至皮糯肉烂。闽南人认为猪脚富含胶质有美容养颜之效，是产妇坐月子和女性进补的必备汤品。花生吸饱了猪脚的汤汁后软糯香甜，往往比猪脚更受欢迎。","link":"https://baike.baidu.com/item/花生猪脚","steps":"1.猪脚请肉贩斩成5cm块，冷水浸泡30分钟泡出血水；2.花生提前4小时冷水浸泡至涨大饱满；3.猪脚冷水下锅加姜片、料酒15ml焯水煮出血沫（约5分钟），捞出温水洗净沥干；4.炒锅下油20ml，小火下姜片、葱段和八角煸至微黄出香；5.下猪脚块中火煸炒5分钟至猪皮微黄收紧、部分油脂被逼出；6.加入冰糖25g炒至融化裹上猪脚，沿锅边淋料酒10ml、生抽30ml、老抽15ml翻炒均匀上色；7.全部转入砂锅或高压锅，加入泡好的花生和开水至没过猪脚约2cm（约800ml）；8.大火烧开撇去浮沫，加盖转小火慢炖1.5小时（高压锅则上汽后转小火压25分钟），至猪脚用筷子轻松戳透、皮糯肉烂、汤汁黏稠，尝味补盐大火收汁即可"},

  const set = new Set();
  recipes.forEach(r => {
    r.mainIngredients.split(',').forEach(ing => {
      set.add(ing.trim());
    });
  });
  return Array.from(set).sort((a, b) => a.localeCompare(b, 'zh'));
}
const allIngredients = collectAllIngredients();

// ===== 时间解析 =====
function parseTimeToMinutes(timeStr) {
  let total = 0;
  const hourMatch = timeStr.match(/(\d+)\s*小时/);
  const minMatch = timeStr.match(/(\d+)\s*分钟/);
  if (hourMatch) total += parseInt(hourMatch[1]) * 60;
  if (minMatch) total += parseInt(minMatch[1]);
  return total;
}

function getTimeCategory(timeStr) {
  const minutes = parseTimeToMinutes(timeStr);
  if (minutes <= 30) return '快速';
  if (minutes <= 60) return '适中';
  return '慢炖';
}

// ===== 食材匹配逻辑 =====
function ingredientMatches(recipeIngredient, searchTerm) {
  const ri = recipeIngredient.trim().toLowerCase();
  const st = searchTerm.trim().toLowerCase();
  return ri.includes(st) || st.includes(ri);
}

function recipeMatchesAnyIngredient(recipe, ingredients) {
  if (ingredients.length === 0) return true;
  const recipeIngs = recipe.mainIngredients.split(',').map(i => i.trim());
  return ingredients.some(sel =>
    recipeIngs.some(ri => ingredientMatches(ri, sel))
  );
}

function filterRecipes() {
  let result = recipes;

  // 维度1: 食材筛选
  if (selectedIngredients.length > 0) {
    result = result.filter(r => recipeMatchesAnyIngredient(r, selectedIngredients));
  }

  // 维度2: 流派筛选
  if (selectedStyle !== '全部') {
    result = result.filter(r => r.style === selectedStyle);
  }

  // 维度3: 难度筛选
  if (selectedDifficulty !== '全部') {
    result = result.filter(r => r.difficulty === selectedDifficulty);
  }

  // 维度4: 耗时筛选
  if (selectedTimeRange !== '全部') {
    result = result.filter(r => getTimeCategory(r.time) === selectedTimeRange);
  }

  return result;
}

// ===== UI 渲染 =====
function renderAll() {
  renderFilterBar();
  renderPresetTags();
  renderSelectedTags();
  renderRecipeCards();
  updateStats();
  updateAutoComplete();
}

function renderPresetTags() {
  const container = document.getElementById('presetTags');
  container.innerHTML = presetIngredients.map(ing => {
    const isActive = selectedIngredients.some(s => s.toLowerCase() === ing.toLowerCase());
    return `<button
      class="px-3.5 py-2 rounded-full text-sm font-medium border-2 transition-all cursor-pointer select-none ${isActive ? 'tag-active' : 'tag-inactive'}"
      onclick="toggleIngredient('${ing}')"
    >${ing}</button>`;
  }).join('');
}

function renderSelectedTags() {
  const container = document.getElementById('selectedTags');
  if (selectedIngredients.length === 0) {
    container.innerHTML = '<span class="text-sm text-stone-300 italic">尚未选择食材，显示全部菜谱</span>';
    return;
  }
  container.innerHTML = selectedIngredients.map((ing, i) => `
    <span class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-minred-50 text-minred rounded-full text-sm font-medium border border-minred/20">
      ${ing}
      <button class="w-5 h-5 rounded-full flex items-center justify-center text-minred/60 ingredient-tag-remove transition-all" onclick="removeIngredient(${i})" title="移除">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </span>
  `).join('');
}

function setStyleFilter(style) {
  selectedStyle = style;
  renderAll();
}

function setDifficultyFilter(difficulty) {
  selectedDifficulty = difficulty;
  renderAll();
}

function setTimeFilter(timeRange) {
  selectedTimeRange = timeRange;
  renderAll();
}

function renderFilterChip(label, value, currentValue, onClick) {
  const isActive = value === currentValue;
  return `<button
    class="px-3 py-1.5 rounded-full text-xs font-medium border-2 transition-all cursor-pointer select-none whitespace-nowrap ${isActive ? 'tag-active' : 'tag-inactive'}"
    onclick="${onClick}('${value}')"
  >${label}</button>`;
}

function renderFilterBar() {
  const styleOptions = [
    { label: '全部', value: '全部' },
    { label: '福州菜', value: '福州菜' },
    { label: '闽南菜', value: '闽南菜' },
    { label: '闽西菜', value: '闽西菜' },
    { label: '莆仙菜', value: '莆仙菜' },
  ];
  const difficultyOptions = [
    { label: '全部', value: '全部' },
    { label: '简单', value: '简单' },
    { label: '中等', value: '中等' },
    { label: '困难', value: '困难' },
  ];
  const timeOptions = [
    { label: '全部', value: '全部' },
    { label: '快速 ≤30min', value: '快速' },
    { label: '适中 30-60min', value: '适中' },
    { label: '慢炖 >60min', value: '慢炖' },
  ];

  document.getElementById('styleFilters').innerHTML = styleOptions.map(o =>
    renderFilterChip(o.label, o.value, selectedStyle, 'setStyleFilter')
  ).join('');

  document.getElementById('difficultyFilters').innerHTML = difficultyOptions.map(o =>
    renderFilterChip(o.label, o.value, selectedDifficulty, 'setDifficultyFilter')
  ).join('');

  document.getElementById('timeFilters').innerHTML = timeOptions.map(o =>
    renderFilterChip(o.label, o.value, selectedTimeRange, 'setTimeFilter')
  ).join('');

  const hasActiveFilter = selectedStyle !== '全部' || selectedDifficulty !== '全部' || selectedTimeRange !== '全部';
  const clearBtn = document.getElementById('clearFilterBtn');
  if (hasActiveFilter && selectedIngredients.length === 0) {
    clearBtn.classList.remove('hidden');
  }
}

function renderRecipeCards() {
  const filtered = filterRecipes();
  const grid = document.getElementById('recipeGrid');
  const empty = document.getElementById('emptyState');

  if (filtered.length === 0) {
    grid.innerHTML = '';
    empty.classList.remove('hidden');
  } else {
    empty.classList.add('hidden');
    grid.innerHTML = filtered.map((r, i) => createRecipeCard(r, i)).join('');
  }
}

function getDifficultyClass(difficulty) {
  if (difficulty === '简单') return 'easy';
  if (difficulty === '中等') return 'medium';
  return 'hard';
}

function createRecipeCard(recipe, index) {
  const mainIngs = recipe.mainIngredients.split(',').map(i => i.trim());
  const highlightIngs = mainIngs.map(ing => {
    const isHighlighted = selectedIngredients.length > 0 && selectedIngredients.some(s =>
      ingredientMatches(ing, s)
    );
    if (isHighlighted) {
      return `<span class="px-2 py-0.5 bg-minred/10 text-minred rounded-full text-xs font-medium">${ing}</span>`;
    }
    return `<span class="px-2 py-0.5 bg-stone-100 text-stone-600 rounded-full text-xs">${ing}</span>`;
  }).join('');

  return `
  <div class="bg-white rounded-2xl border border-stone-200 p-5 card-hover cursor-pointer group" onclick="openDetail(${index})">
    <div class="flex items-start justify-between mb-3">
      <h3 class="text-lg font-bold text-stone-900 group-hover:text-minred transition-colors">${recipe.name}</h3>
      <span class="text-xs px-2.5 py-1 rounded-full bg-minred-50 text-minred font-medium whitespace-nowrap ml-2">${recipe.style}</span>
    </div>
    <div class="flex flex-wrap items-center gap-2 mb-3 text-xs text-stone-500">
      <span class="flex items-center gap-1">🍽️ ${recipe.taste}</span>
    </div>
    <div class="flex flex-wrap gap-1.5 mb-3">
      ${highlightIngs}
    </div>
    <div class="flex items-center justify-between pt-3 border-t border-stone-100">
      <span class="difficulty-badge ${getDifficultyClass(recipe.difficulty)} text-xs px-2.5 py-1 rounded-full font-medium">${recipe.difficulty}</span>
      <span class="text-xs text-stone-400 flex items-center gap-1">⏱️ ${recipe.time}</span>
    </div>
  </div>`;
}

function updateStats() {
  const filtered = filterRecipes();
  document.getElementById('resultCount').textContent = filtered.length;
  document.getElementById('recipeCount').textContent = `${filtered.length} 道菜谱`;
  const hint = document.getElementById('filterHint');
  const clearBtn = document.getElementById('clearFilterBtn');
  const hasAnyFilter = selectedIngredients.length > 0 || selectedStyle !== '全部' || selectedDifficulty !== '全部' || selectedTimeRange !== '全部';
  if (hasAnyFilter) {
    hint.classList.remove('hidden');
    clearBtn.classList.remove('hidden');
  } else {
    hint.classList.add('hidden');
    clearBtn.classList.add('hidden');
  }
}

// ===== 交互逻辑 =====
function toggleIngredient(ingredient) {
  const idx = selectedIngredients.findIndex(s => s.toLowerCase() === ingredient.toLowerCase());
  if (idx >= 0) {
    selectedIngredients.splice(idx, 1);
  } else {
    selectedIngredients.push(ingredient);
  }
  renderAll();
}

function removeIngredient(index) {
  selectedIngredients.splice(index, 1);
  renderAll();
}

function addCustomIngredient() {
  const input = document.getElementById('ingredientInput');
  const value = input.value.trim();
  if (!value) return;
  const exists = selectedIngredients.some(s => s.toLowerCase() === value.toLowerCase());
  if (!exists) {
    selectedIngredients.push(value);
    renderAll();
  }
  input.value = '';
  document.getElementById('suggestions').classList.add('hidden');
}

function clearAllFilters() {
  selectedIngredients = [];
  selectedStyle = '全部';
  selectedDifficulty = '全部';
  selectedTimeRange = '全部';
  document.getElementById('ingredientInput').value = '';
  document.getElementById('suggestions').classList.add('hidden');
  renderAll();
}

// ===== 自动补全 =====
function updateAutoComplete() {
  const input = document.getElementById('ingredientInput');
  const val = input.value.trim().toLowerCase();
  const box = document.getElementById('suggestions');
  if (!val) { box.classList.add('hidden'); return; }
  const matches = allIngredients.filter(ing =>
    ing.toLowerCase().includes(val) &&
    !selectedIngredients.some(s => s.toLowerCase() === ing.toLowerCase())
  ).slice(0, 8);
  if (matches.length === 0) { box.classList.add('hidden'); return; }
  box.innerHTML = matches.map(m => `
    <div class="px-4 py-2.5 hover:bg-minred-50 cursor-pointer text-stone-700 text-sm border-b border-stone-50 last:border-0 transition-colors flex items-center justify-between" onclick="selectSuggestion('${m}')">
      <span>${m}</span><span class="text-xs text-stone-400">点击添加</span>
    </div>`).join('');
  box.classList.remove('hidden');
}

function selectSuggestion(ingredient) {
  const exists = selectedIngredients.some(s => s.toLowerCase() === ingredient.toLowerCase());
  if (!exists) { selectedIngredients.push(ingredient); renderAll(); }
  document.getElementById('ingredientInput').value = '';
  document.getElementById('suggestions').classList.add('hidden');
}

// ===== 详情弹窗 =====
function openDetail(filteredIndex) {
  const filtered = filterRecipes();
  const recipe = filtered[filteredIndex];
  if (!recipe) return;
  const mainIngs = recipe.mainIngredients.split(',').map(i => i.trim());
  const seasons = recipe.seasoning.split(',').map(i => i.trim());
  const steps = recipe.steps.split(/[;；]/).filter(s => s.trim());
  const modal = document.getElementById('detailModal');
  const content = document.getElementById('modalContent');
  content.innerHTML = `
    <div class="sticky top-0 bg-white border-b border-stone-100 px-6 py-4 flex items-center justify-between rounded-t-2xl z-10">
      <div class="flex items-center gap-2">
        <span class="text-xs px-2.5 py-1 rounded-full bg-minred-50 text-minred font-medium">${recipe.style}</span>
        <span class="difficulty-badge ${getDifficultyClass(recipe.difficulty)} text-xs px-2.5 py-1 rounded-full font-medium">${recipe.difficulty}</span>
      </div>
      <button onclick="closeModal()" class="w-8 h-8 rounded-full hover:bg-stone-100 flex items-center justify-center transition-colors text-stone-400 hover:text-stone-600">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="px-6 py-5">
      <h2 class="text-2xl font-bold text-stone-900 mb-1">${recipe.name}</h2>
      <p class="text-stone-500 mb-5 flex flex-wrap items-center gap-x-2 gap-y-1 text-sm">
        <span>🍽️ ${recipe.taste}</span><span class="text-stone-300">·</span>
        <span>⏱️ ${recipe.time}</span><span class="text-stone-300">·</span>
        <span>👥 ${recipe.servings || '3-4人份'}</span>
      </p>
      <div class="mb-5">
        <h4 class="text-sm font-semibold text-stone-700 mb-2 flex items-center gap-2"><span class="w-1.5 h-4 bg-minred rounded-full inline-block"></span>主要食材</h4>
        <div class="flex flex-wrap gap-1.5">
          ${mainIngs.map(ing => {
            const hl = selectedIngredients.length > 0 && selectedIngredients.some(s => ingredientMatches(ing, s));
            return `<span class="px-3 py-1 rounded-full text-sm font-medium ${hl ? 'bg-minred/10 text-minred border border-minred/30' : 'bg-stone-100 text-stone-600'}">${ing}</span>`;
          }).join('')}
        </div>
      </div>
      <div class="mb-5">
        <h4 class="text-sm font-semibold text-stone-700 mb-2 flex items-center gap-2"><span class="w-1.5 h-4 bg-amber-500 rounded-full inline-block"></span>调料</h4>
        <div class="flex flex-wrap gap-1.5">
          ${seasons.map(s => `<span class="px-3 py-1 rounded-full text-sm bg-amber-50 text-amber-700 border border-amber-200">${s}</span>`).join('')}
        </div>
      </div>
      ${recipe.story ? `
      <div class="mb-5 p-4 bg-blue-50 rounded-xl border border-blue-200">
        <h4 class="text-sm font-semibold text-blue-700 mb-2 flex items-center gap-2"><span class="w-1.5 h-4 bg-blue-500 rounded-full inline-block"></span>📖 文化背景</h4>
        <p class="text-sm text-blue-800 leading-relaxed">${recipe.story}</p>
      </div>` : ''}
      <div>
        <h4 class="text-sm font-semibold text-stone-700 mb-3 flex items-center gap-2"><span class="w-1.5 h-4 bg-emerald-500 rounded-full inline-block"></span>做法步骤</h4>
        <ol class="space-y-3">
          ${steps.map((s, i) => `
            <li class="flex gap-3 text-sm text-stone-700 leading-relaxed">
              <span class="flex-shrink-0 w-6 h-6 rounded-full bg-minred text-white text-xs flex items-center justify-center font-bold">${i + 1}</span>
              <span class="pt-0.5">${s.trim().replace(/^(\d+\.?\s*)/, '')}</span>
            </li>`).join('')}
        </ol>
      </div>
      ${recipe.tips ? `
      <div class="mt-5 p-4 bg-amber-50 rounded-xl border border-amber-200">
        <h4 class="text-sm font-semibold text-amber-700 mb-2 flex items-center gap-2"><span class="w-1.5 h-4 bg-amber-500 rounded-full inline-block"></span>💡 烹饪小贴士</h4>
        <p class="text-sm text-amber-800 leading-relaxed">${recipe.tips}</p>
      </div>` : ''}
      ${recipe.link ? `
      <div class="mt-4 text-center">
        <a href="${recipe.link}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1.5 px-5 py-2.5 bg-stone-100 hover:bg-stone-200 text-stone-600 hover:text-stone-800 rounded-xl text-sm font-medium transition-all">
          🔗 在百度百科查看完整介绍 <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
        </a>
      </div>` : ''}
    </div>`;
  modal.classList.remove('hidden');
  modal.classList.add('flex');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  const modal = document.getElementById('detailModal');
  modal.classList.add('hidden');
  modal.classList.remove('flex');
  document.body.style.overflow = '';
}

function closeModalOutside(event) {
  if (event.target === document.getElementById('detailModal')) { closeModal(); }
}

// ===== 键盘事件 =====
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') { closeModal(); }
  if (e.key === 'Enter' && document.activeElement === document.getElementById('ingredientInput')) { addCustomIngredient(); }
});

// ===== 输入框实时监听 =====
document.getElementById('ingredientInput').addEventListener('input', updateAutoComplete);

// 点击外部关闭建议
document.addEventListener('click', function(e) {
  const input = document.getElementById('ingredientInput');
  const box = document.getElementById('suggestions');
  if (!input.contains(e.target) && !box.contains(e.target)) { box.classList.add('hidden'); }
});

// 添加食材按钮
document.getElementById('addIngredientBtn').addEventListener('click', addCustomIngredient);

// 清除筛选按钮
document.getElementById('clearFilterBtn').addEventListener('click', clearAllFilters);

// ===== 初始渲染 =====
renderAll();
</script>
</body>
</html>
